rection.", "Reading to speaking is a language skill, not ESD.", "Moving from knowing to ignoring would mean less learning; ESD aims for active, learner-centred learning."]}, {"w": 12, "q": "___ competency is the ability to reflect on one’s own role in the local community and (global) society.", "o": ["collaboration", "self-awareness", "strategic", "normative"], "a": 1, "why": "Self-awareness competency is reflecting on your own role in your community and in global society.", "x": ["Collaboration competency is about working with others.", null, "Strategic competency is about planning and acting.", "Normative competency is about values and norms."]}]}, {"id": "introduction_to_internet_of_things", "name": "Introduction to Internet of Things", "institute": "IIT Kharagpur", "short": "IoT", "questions": [{"w": 0, "q": "Which of the following allows us to identify objects and extract information?", "o": ["RFID", "Sensors", "Actuators", "IoT Nodes"], "a": 0, "why": "RFID tags store an identifier that a reader picks up by radio, so objects can be identified and their data read without line of sight.", "x": []}, {"w": 0, "q": "How many layers does Zigbee consist of?", "o": ["1", "2", "3", "4"], "a": 3, "why": "Zigbee has four layers: physical, MAC (both from IEEE 802.15.4), network and application.", "x": []}, {"w": 0, "q": "Which of the following is not a component of cloud computing?", "o": ["Clients", "Local Servers", "Services", "Applications"], "a": 1, "why": "Cloud computing is made of clients, services and applications delivered over the network. Local servers are what a traditional on-premises setup uses, not a cloud component.", "x": []}, {"w": 0, "q": "Which of the following is a distance measuring sensor module?", "o": ["DHT22", "HC-SR04", "TSL2591", "HC-SR505"], "a": 1, "why": "HC-SR04 is an ultrasonic module that measures distance from the echo time. DHT22 is temperature/humidity, TSL2591 is light, HC-SR505 is a PIR motion sensor.", "x": []}, {"w": 0, "q": "Which of the following is a component in a typical sensor network?", "o": ["Sink", "Gateway", "Router", "All of these"], "a": 3, "why": "A sensor network uses sinks to collect data, gateways to connect to other networks and routers to forward packets, so all of these are components.", "x": []}, {"w": 0, "q": "Which of the following sensors are responsible for measuring orientation and angular velocity?", "o": ["Accelerometer", "GPS", "Temperature", "None of these"], "a": 3, "why": "Orientation and angular velocity are measured by a gyroscope. An accelerometer measures acceleration, GPS gives location, and a temperature sensor gives temperature, so none of these fits.", "x": []}, {"w": 0, "q": "\"ISA 100.11A\" is a wireless networking technology standard. ISA stands for ___.", "o": ["International Society of Automation", "International Society of Advancement", "Industrial Society of Automation", "Industrial Society of Advancement"], "a": 0, "why": "ISA 100.11a comes from the International Society of Automation.", "x": []}, {"w": 0, "q": "Which of the following is not a difference between traditional data center and cloud computing?", "o": ["Scalability", "Flexibility", "Elasticity", "Storage"], "a": 3, "why": "Both traditional data centres and the cloud provide storage. Scalability, flexibility and elasticity are what make the cloud different.", "x": []}, {"w": 0, "q": "Smart grid is also known as the energy internet.", "o": ["True", "False"], "a": 0, "why": "True. The smart grid is often called the energy internet because power and information flow both ways across the network.", "x": []}, {"w": 0, "q": "Can a point of node failure result in the partition of the network in the stationary sensor network?", "o": ["Yes", "No"], "a": 0, "why": "Yes. In a stationary network nodes can't move to fill a gap, so if a node that links two parts fails, the network can split into partitions.", "x": []}, {"w": 1, "q": "What is the full form of IoT?", "o": ["Internet of Tasks", "Internet of Articles", "Internet of Taps", "None of these"], "a": 3, "why": "IoT stands for Internet of Things, which isn't listed, so the answer is none of these.", "x": []}, {"w": 1, "q": "The \"Source Address\" field in the IPv6 header is of ___ bits in length.", "o": ["32", "64", "128", "None of these"], "a": 2, "why": "An IPv6 address is 128 bits long, so the source address field is 128 bits.", "x": []}, {"w": 1, "q": "Which of the following is/are not an enabler of IoT?", "o": ["RFID", "Sensors and Actuators", "Cloud Computing", "None of these"], "a": 3, "why": "RFID, sensors and actuators, and cloud computing are all enablers of IoT, so none of them is 'not an enabler'.", "x": []}, {"w": 1, "q": "The gateway is tasked with assigning a unique address to each of the field devices or sensors within its jurisdiction.", "o": ["True", "False"], "a": 0, "why": "True. The gateway gives each field device in its area a unique local address and translates between the local network and the wider network.", "x": []}, {"w": 1, "q": "The increasing number of devices in IoT is expected to result in an address crunch.", "o": ["True", "False"], "a": 0, "why": "True. Billions of new connected devices need addresses, which is why IPv4 runs short and IPv6 is needed.", "x": []}, {"w": 1, "q": "In ___ a node/network is connected to multiple networks for improved reliability.", "o": ["Transparent roaming", "Multi-clouding", "None of these", "Both (a) and (b)"], "a": 2, "why": "Connecting a node or network to several networks for reliability is called multi-homing, which isn't listed, so the answer is none of these.", "x": []}, {"w": 1, "q": "Which of the following is NOT a function of an IoT Gateway?", "o": ["Connects the IoT LAN to a WAN", "Can implement several LAN and WAN", "Both (a) and (b)", "Neither (a) nor (b)"], "a": 3, "why": "An IoT gateway does connect the local network (LAN) to the wide-area network (WAN) and can run several LAN and WAN technologies, so neither option is 'not a function'.", "x": []}, {"w": 1, "q": "Which of the following statements is/are incorrect? Statement I: An actuator is a component of a machine or system that moves or controls the mechanism or the system. Statement II: An actuator requires a control signal and a source of energy.", "o": ["Statement I is incorrect", "Statement II is incorrect", "Both statements are incorrect", "Both statements are correct"], "a": 3, "why": "Both statements are correct: an actuator moves or controls a mechanism, and it needs a control signal plus an energy source.", "x": []}, {"w": 1, "q": "Which of the following is NOT a function of an IoT LAN?", "o": ["Long range communication, global", "World wide connections", "Both (a) and (b)", "Neither (a) nor (b)"], "a": 2, "why": "An IoT LAN is short-range and local. Long-range, global and worldwide connections belong to the WAN, so both (a) and (b) are not LAN functions.", "x": []}, {"w": 1, "q": "The word \"Transducer\" is a collective term used for both Sensors and Actuators.", "o": ["True", "False"], "a": 0, "why": "True. A transducer converts one form of energy into another, which covers both sensors and actuators.", "x": []}, {"w": 1, "q": "Analog Sensors produce a discontinuous output signal or voltage, which is generally proportional to the quantity being measured.", "o": ["True", "False"], "a": 1, "why": "False. Analog sensors give a continuous output signal; discontinuous (discrete) output is what digital sensors give.", "x": []}, {"w": 1, "q": "If the output signal differs from the correct value by a constant, the sensor has an ___.", "o": ["Offset error", "Bias", "Both (a) and (b)", "None of these"], "a": 2, "why": "When the output is off from the true value by a constant amount, this is called both an offset error and a bias.", "x": []}, {"w": 1, "q": "Pneumatic actuators enable the production of large forces from a relatively larger pressure changes.", "o": ["False", "True"], "a": 0, "why": "False. Pneumatic actuators produce large forces from relatively small pressure changes, not large ones.", "x": []}, {"w": 1, "q": "A sensor node is made up of which of the following?", "o": ["Sensor/Sensors", "A processing unit", "A power unit", "All of these"], "a": 3, "why": "A sensor node contains sensors, a processing unit, a power unit and usually a radio, so all of these are parts of it.", "x": []}, {"w": 1, "q": "What is the full form of SMP in the context of IoT actuators?", "o": ["Shape Memory Polymers", "Shape Master Polymers", "Switch Mode Power", "Sensor Making Polymer"], "a": 0, "why": "SMP stands for Shape Memory Polymers: materials that return to a set shape when triggered, for example by heat, so they can act as actuators.", "x": []}, {"w": 2, "q": "The full form of MQTT is", "o": ["Message Query Telemetry Transport", "Message Queue Telemetry Transport", "Message Queue Telemedicine Transport", "None of these"], "a": 1, "why": "MQTT stands for Message Queue Telemetry Transport.", "x": []}, {"w": 2, "q": "XMPP uses the ___ architecture.", "o": ["Publish-subscribe", "Client-server", "Both (a) and (b)", "Neither (a) nor (b)"], "a": 1, "why": "XMPP mainly uses a client-server architecture in which clients talk through XMPP servers.", "x": []}, {"w": 2, "q": "With respect to AMQP, which of the following message delivery guarantees allow each message to be delivered certainly but also may be delivered multiple times?", "o": ["At-least-once", "At-most-once", "Exactly-once", "Both (a) and (b)"], "a": 0, "why": "At-least-once delivery guarantees that every message arrives, but some may arrive more than once.", "x": []}, {"w": 2, "q": "In MQTT for IoT, the Publishers are ___.", "o": ["Lightweight sensors", "Actuators", "Processing units", "None of these"], "a": 0, "why": "In MQTT, publishers are lightweight sensors that send their data to a broker.", "x": []}, {"w": 2, "q": "Which of the following is NOT a method in MQTT?", "o": ["Publish", "Connect", "Disconnect", "None of these"], "a": 3, "why": "Publish, Connect and Disconnect are all MQTT methods (others include Subscribe and Unsubscribe), so none of these is 'not a method'.", "x": []}, {"w": 2, "q": "CoAP has ___ modes for messaging.", "o": ["2", "4", "8", "None of these"], "a": 1, "why": "CoAP has four message types: Confirmable, Non-confirmable, Acknowledgement and Reset.", "x": []}, {"w": 2, "q": "CoAP architecture is divided into three sub-layers. The messaging sub-layer is responsible for reliability and duplication of messages, while the request- response sub-layer is responsible for communication. The last layer, which is optional, is responsible for user registration.", "o": ["True", "False"], "a": 1, "why": "False. CoAP's sub-layers are messaging and request/response; the description of an optional third layer for user registration is not correct.", "x": []}, {"w": 2, "q": "What is the full form of XMPP in IoT?", "o": ["Extensible Markup Page Processing", "Extensible Messaging and Presence Protocol", "Both (a) and (b)", "Neither (a) nor (b)"], "a": 1, "why": "XMPP stands for Extensible Messaging and Presence Protocol.", "x": []}, {"w": 2, "q": "XMPP is not an open standard protocol.", "o": ["False", "True"], "a": 0, "why": "False. XMPP is an open standard protocol, standardised by the IETF.", "x": []}, {"w": 2, "q": "Which of the following is/are not a frame type of the AMQP protocol?", "o": ["Origin", "Destination", "Advance", "All of these"], "a": 3, "why": "Origin, Destination and Advance are not AMQP frame types (AMQP uses frames such as open, begin, attach, transfer, flow, disposition, detach, end and close), so all of these are not frame types.", "x": []}, {"w": 2, "q": "What is the basic unit of data in the AMQP protocol?", "o": ["Chunk", "Byte", "Packet", "None of these"], "a": 3, "why": "The basic unit of data in AMQP is the frame, which isn't listed, so the answer is none of these.", "x": []}, {"w": 2, "q": "Which of the following is/are exchange types in AMQP?", "o": ["Direct", "Fan-out", "Topic", "All of these"], "a": 3, "why": "AMQP exchange types include direct, fan-out, topic and header, so all of the listed ones are exchange types.", "x": []}, {"w": 2, "q": "Which of the following is/are not an application of 6LoWPAN?", "o": ["IoT", "IIoT", "Both (a) and (b)", "Neither (a) nor (b)"], "a": 3, "why": "6LoWPAN carries IPv6 over low-power wireless links and is used in both IoT and IIoT, so neither option is 'not an application'.", "x": []}, {"w": 2, "q": "The OSI model has ___ layers.", "o": ["6", "9", "4", "None of these"], "a": 3, "why": "The OSI model has 7 layers, which isn't listed, so the answer is none of these.", "x": []}, {"w": 2, "q": "The \"Destination Address\" in the IPv4 packet represents which of the following?", "o": ["The destination node address of the packet", "The intermediate hop in the network", "Both (a) and (b)", "None of these"], "a": 0, "why": "The destination address in an IPv4 packet is the final destination node, not an intermediate hop.", "x": []}, {"w": 3, "q": "There is no network layer in Wired HART.", "o": ["True", "False"], "a": 0, "why": "True. WirelessHART adds a network layer; wired HART, as the course describes it, has no network layer.", "x": []}, {"w": 3, "q": "Zwave operates at ___ MHz in the US and ___ MHz in Europe.", "o": ["1008, 989", "908.42, 868.42", "767.56, 855.28", "None of these"], "a": 1, "why": "Z-Wave uses 908.42 MHz in the US and 868.42 MHz in Europe.", "x": []}, {"w": 3, "q": "Dumb behavior of sensor nodes is ___ in nature (as it is dependent on the effects of the environmental conditions).", "o": ["Temporal", "Spatial", "Both (a) and (b)", "None of these"], "a": 0, "why": "Dumb behaviour, where a node temporarily can't sense or communicate because of environmental conditions, is temporal: it lasts only while those conditions last.", "x": []}, {"w": 3, "q": "The process of identifying channels consistently affected by interference and removing them from use is known as ___.", "o": ["Channel Trimming", "Channel Flushing", "Both (a) and (b)", "None of these"], "a": 3, "why": "Removing channels that keep getting interference is called channel blacklisting, which isn't listed, so the answer is none of these.", "x": []}, {"w": 3, "q": "The full form of NFC is", "o": ["Near Field Contact", "Near Field Communication", "Both (a) and (b)", "Neither (a) nor (b)"], "a": 1, "why": "NFC stands for Near Field Communication.", "x": []}, {"w": 3, "q": "NFC works on the principle of magnetic induction.", "o": ["True", "False"], "a": 0, "why": "True. NFC works by magnetic induction between two loop antennas placed very close together.", "x": []}, {"w": 3, "q": "NFC tags found in supermarket products are examples of active NFC.", "o": ["True", "False"], "a": 1, "why": "False. NFC tags on supermarket products are passive: they have no power source and are powered by the reader's field.", "x": []}, {"w": 3, "q": "Bluetooth is based on ___.", "o": ["Nanonets", "Binarynets", "Both (a) and (b)", "None of these"], "a": 3, "why": "Bluetooth is based on piconets, small ad hoc networks with one master and up to seven active slaves, so the answer is none of these.", "x": []}, {"w": 3, "q": "A ___ in NFC emits a small electric current which creates a magnetic field that in turn bridges the physical space between the devices.", "o": ["Reader", "Writer", "Destroyer", "None of these"], "a": 0, "why": "In NFC the reader produces a small current and a magnetic field that bridges the gap and powers or talks to the tag.", "x": []}, {"w": 3, "q": "Bluetooth technology is based on Ad-hoc network technology.", "o": ["False", "True"], "a": 1, "why": "True. Bluetooth devices form ad hoc networks (piconets) without fixed infrastructure.", "x": []}, {"w": 3, "q": "Zwave utilizes GFSK modulation and Hongkong channel encoding.", "o": ["True", "False"], "a": 1, "why": "False. Z-Wave uses GFSK modulation with Manchester channel encoding, not 'Hongkong' encoding.", "x": []}, {"w": 3, "q": "The process of bypassing radio dead-spots is done using a message called ___ in Zwave.", "o": ["Ping", "Healing", "Frame", "None of these"], "a": 1, "why": "In Z-Wave, the healing message lets the mesh find a new route around radio dead spots.", "x": []}, {"w": 3, "q": "Sensor nodes have unlimited battery life.", "o": ["True", "False"], "a": 1, "why": "False. Sensor nodes usually run on small batteries with limited life, which is why energy efficiency matters so much.", "x": []}, {"w": 3, "q": "The Link Manager Protocol in Bluetooth manages the establishment, authentication, link configuration.", "o": ["True", "False"], "a": 0, "why": "True. Bluetooth's Link Manager Protocol handles link setup, authentication and configuration.", "x": []}, {"w": 3, "q": "Zigbee commonly uses ___ data rate.", "o": ["250 kbps", "250 Mbps", "260 kbps", "260 Mbps"], "a": 0, "why": "Zigbee (on IEEE 802.15.4 at 2.4 GHz) commonly runs at 250 kbps.", "x": []}, {"w": 4, "q": "Instead of a PIR sensor, a camera can also be used in the agricultural field to detect intruders.", "o": ["True", "False"], "a": 0, "why": "True. A camera with image processing can detect intruders in a field as an alternative to a PIR motion sensor.", "x": []}, {"w": 4, "q": "An ultrasonic sensor senses the ___ at which the object is located.", "o": ["distance", "coordinates", "Both (a) and (b)", "None of these"], "a": 0, "why": "An ultrasonic sensor measures the distance to an object from the time its sound echo takes to return.", "x": []}, {"w": 4, "q": "WMSNs can be used for", "o": ["Security surveillance", "Wild-habitat monitoring", "Environmental monitoring", "All of these"], "a": 3, "why": "Wireless multimedia sensor networks (WMSNs) are used for security surveillance, wildlife habitat monitoring and environmental monitoring, so all of these.", "x": []}, {"w": 4, "q": "Objective of coverage in WSN is to use minimum number of sensors and maximize network lifetime.", "o": ["True", "False"], "a": 0, "why": "True. Coverage aims to watch the whole area with as few active sensors as possible, which saves energy and lengthens network lifetime.", "x": []}, {"w": 4, "q": "What is the full form of AUV in the context of mobile wireless sensor networks?", "o": ["Aerial and Underwater Vehicle", "Ambient and Underprivileged Vehicle", "Astral Underwater Vehicle", "None of these"], "a": 3, "why": "In this context AUV means Autonomous Underwater Vehicle, which isn't listed, so the answer is none of these.", "x": []}, {"w": 4, "q": "In the localized coverage algorithm, special types of distributed algorithms are used where only one subset of nodes participates in sensing, communication, and computation.", "o": ["True", "False"], "a": 0, "why": "True. Localized coverage algorithms are distributed, and only a subset of nodes stays active for sensing, communication and computation.", "x": []}, {"w": 4, "q": "Which of the following is/are advantage/advantages of Stationary Wireless Sensor Networks?", "o": ["Easy deployment", "Easy topology maintenance", "Both (a) and (b)", "None of these"], "a": 2, "why": "Stationary wireless sensor networks are easy to deploy and their topology is easy to maintain because nodes don't move, so both (a) and (b).", "x": []}, {"w": 4, "q": "In Human-centric Sensing, human beings can act as Sensor Operators.", "o": ["True", "False"], "a": 0, "why": "True. In human-centric sensing people can operate sensors themselves, for example by collecting data with their phones.", "x": []}, {"w": 4, "q": "Which of the following is not a property of MANET-infrastructure less network of mobile devices connected wirelessly?", "o": ["Self-CHOP", "Self-HOP", "Both (a) and (b)", "None of these"], "a": 3, "why": "A MANET is self-organising (self-CHOP: configuring, healing, optimising, protecting) and multi-hop (self-HOP), so both are properties and the answer is none of these.", "x": []}, {"w": 4, "q": "UAV networks provide a solution for deployments where there is a need for frequent change configurations.", "o": ["False", "True"], "a": 1, "why": "True. UAV networks can be moved and reconfigured quickly, which suits deployments that need frequent configuration changes.", "x": []}, {"w": 4, "q": "Which of the following is NOT a feature of mesh topology in UAV system?", "o": ["Flexible", "Reliable", "None of these", "Both (a) and (b)"], "a": 2, "why": "Mesh topology in UAV systems is both flexible and reliable, so neither is 'not a feature' and the answer is none of these.", "x": []}, {"w": 4, "q": "Which of the following is not a property of a FANET?", "o": ["Inter-plane communication", "Intra-plane communication", "Both (a) and (b)", "None of these"], "a": 3, "why": "FANETs (flying ad hoc networks) use both inter-plane and intra-plane communication, so none of these is 'not a property'.", "x": []}, {"w": 4, "q": "M2M networks are characterized by a few number of sensor nodes deployed over a large area.", "o": ["False", "True", "Cannot be determined"], "a": 0, "why": "False. M2M networks usually have a large number of nodes, often deployed densely.", "x": []}, {"w": 4, "q": "What is the full form of M2SP in the context of Machine-to-Machine Communication?", "o": ["M2M Stateless Platform", "M2M Session Packet", "M2M Secure Packaging", "None of these"], "a": 3, "why": "In M2M architecture M2SP means M2M Service Platform, which isn't listed, so the answer is none of these.", "x": []}, {"w": 4, "q": "The ___ provides integrated services based on device collected data- sets.", "o": ["M2M Application Platform", "M2M Service Platform", "M2M Hardware Platform", "None of these"], "a": 0, "why": "The M2M Application Platform provides integrated services built from the data sets collected by devices.", "x": []}, {"w": 5, "q": "What does the term \"Interoperability\" refer to in the context of IoT?", "o": ["The ability of a system to operate without power", "The ability of different systems/products to work together without restrictions", "The ability to increase the speed of the internet", "None of these"], "a": 1, "why": "Interoperability is the ability of different systems and products to work together without restrictions.", "x": []}, {"w": 5, "q": "In the collaborative concept (Cosine) theory for interoperability, an object is defined as a quadruple (A, B, C, D). What does 'C' represent?", "o": ["The natural language used", "The internal identifier", "The context of A", "The definition of the object"], "a": 2, "why": "In the Cosine quadruple, C represents the context of A, the setting in which the object's meaning applies.", "x": []}, {"w": 5, "q": "Which of the following best describes the \"Syntactic Interoperability\" challenge?", "o": ["Devices having different physical shapes", "Devices using different message formats and data structures", "Devices located in different countries", "Devices having different owners"], "a": 1, "why": "Syntactic interoperability problems arise when devices use different message formats and data structures.", "x": []}, {"w": 5, "q": "Which of the following is a primary reason for the popularity of Arduino in IoT implementations?", "o": ["It is highly expensive and exclusive", "It is low resource-consuming and cheap", "It requires high-power external cooling", "It only supports digital signals"], "a": 1, "why": "Arduino is popular in IoT because it is cheap, uses few resources and is easy to program.", "x": []}, {"w": 5, "q": "What is the clock speed of the Arduino Uno board?", "o": ["8 MHz", "32 MHz", "16 MHz", "50 MHz"], "a": 2, "why": "The Arduino Uno runs at 16 MHz.", "x": []}, {"w": 5, "q": "Which function is used to iteratively loop over instances in an Arduino sketch?", "o": ["setup()", "main()", "loop()", "start()"], "a": 2, "why": "Code in loop() runs over and over, while setup() runs once at the start.", "x": []}, {"w": 5, "q": "In Arduino, what is the default starting index for an array?", "o": ["1", "-1", "0", "10"], "a": 2, "why": "Arduino is programmed in C/C++, where arrays start at index 0.", "x": []}, {"w": 5, "q": "What does the delay(5000) command do in a traffic signal simulation?", "o": ["Resets the Arduino board", "Introduces a delay of 5 seconds", "Turns off all LEDs immediately", "Skips the current execution loop"], "a": 1, "why": "delay() takes milliseconds, so delay(5000) pauses for 5 seconds, for example to keep a traffic light on.", "x": []}, {"w": 5, "q": "Which header file must be called to use mathematical functions like sin() or cos()?", "o": ["arduino.h", "math.h", "sensor.h", "stdio.h"], "a": 1, "why": "Mathematical functions such as sin() and cos() come from the math.h header.", "x": []}, {"w": 5, "q": "The DHT22 sensor is used for measuring which physical quantities?", "o": ["Pressure and Altitude", "Light and Sound", "Humidity and Temperature", "Motion and Direction"], "a": 2, "why": "The DHT22 measures humidity and temperature.", "x": []}, {"w": 5, "q": "What is the recommended voltage range for the VCC pin of a DHT sensor to avoid damage?", "o": ["1V to 2V", "3.3V to 5V", "12V to 24V", "0V to 1V"], "a": 1, "why": "The DHT sensor's VCC pin should get 3.3 V to 5 V; higher voltages can damage it.", "x": []}, {"w": 5, "q": "When integrating a typical digital temperature and humidity sensor (like the DHT series) with an Arduino board, which Arduino pin connection is used to receive the sensor’s data?", "o": ["Ground (GND)", "Signal/data pin", "5 V power pin", "Analog input AREF"], "a": 1, "why": "The DHT sensor sends its readings on its signal (data) pin, which connects to a digital pin on the Arduino.", "x": []}, {"w": 5, "q": "Which of the following describes the primary function of an actuator?", "o": ["Converts motion to energy", "Converts energy or signals into motion", "Stores data", "Connects to the internet"], "a": 1, "why": "An actuator turns energy or a control signal into motion.", "x": []}, {"w": 5, "q": "When using the Servo library in Arduino, which function is used to specify the pin where the servo is connected?", "o": ["servo.connect()", "servo.attach()", "servo.pinMode()", "servo.write()"], "a": 1, "why": "servo.attach(pin) tells the Servo library which pin the servo is connected to.", "x": []}, {"w": 5, "q": "In the context of the Arduino Servo library, which of the following is the correct function to command the servo motor to rotate to a specific angle?", "o": ["servo.move(angle)", "servo.rotate(angle)", "servo.write(angle)", "servo.turn(angle)"], "a": 2, "why": "servo.write(angle) moves a standard servo to the given angle.", "x": []}, {"w": 6, "q": "What is the output of the following Python code snippet? x = \"This is Python\" print(x[2:4])", "o": ["is", "hi", "Th"], "a": 0, "why": "Python slices include the start index and stop before the end index. In 'This is Python', indexes 2 and 3 are 'i' and 's', so x[2:4] is 'is'.", "x": []}, {"w": 6, "q": "What is the purpose of the try...except block in Python?", "o": ["To define a function", "To create a loop", "To handle exceptions and errors during code execution without crashing the program", "To import libraries"], "a": 2, "why": "try...except catches errors (exceptions) so the program can handle them instead of crashing.", "x": []}, {"w": 6, "q": "Which of the following is a specific requirement in Python for defining code blocks (such as inside if-else statements or loops) that distinguishes it from many other programming languages?", "o": ["It requires the use of curly braces {} to enclose the code block", "It requires a begin and end keyword to mark the start and finish of the block", "It follows a very rigid indentation policy to indicate different blocks of code", "It requires every line of the block to end with a semicolon ;"], "a": 2, "why": "Python uses indentation, not braces or keywords, to mark blocks of code, and it is strict about it.", "x": []}, {"w": 6, "q": "When setting up a UDP client-server network in Python, why is it critical that both the client and server use the same port numb ller handles about 200 requests per second.", "x": []}, {"w": 7, "q": "What is SDN-WISE?", "o": ["A hardware component for sensors", "A Software Defined WSN platform where the flow table is available at sensor nodes", "A database management system", "A type of cloud storage"], "a": 1, "why": "SDN-WISE is a software-defined wireless sensor network platform in which the sensor nodes themselves keep flow tables.", "x": []}, {"w": 7, "q": "In the experimental results shown for Soft-WSN (Software Defined Wireless Sensor Network), how does the Packet Delivery Ratio (PDR) compare to a traditional WSN?", "o": ["PDR is lower in Soft-WSN", "PDR is significantly improved (higher) in Soft-WSN", "PDR remains exactly the same", "Soft-WSN does not support packet delivery"], "a": 1, "why": "In the course's results, Soft-WSN delivers a noticeably higher share of packets (packet delivery ratio) than a traditional WSN.", "x": []}, {"w": 7, "q": "In the 'Software Defined IoT' architecture, where are flow classification and enhanced security typically handled?", "o": ["At the physical sensor nodes", "At the Data Center Networks", "At the gateways only", "At the user's mobile device"], "a": 1, "why": "In the Software Defined IoT architecture, flow classification and stronger security are handled in the data centre networks.", "x": []}, {"w": 8, "q": "Which architecture proposes the use of an agent placed at access points to communicate with the controller in Software Defined Mobile Networks?", "o": ["uFlow", "Odin", "MobileFlow", "OpenFlow"], "a": 1, "why": "Odin places an agent at each access point that talks to the SDN controller to manage mobile clients.", "x": []}, {"w": 8, "q": "Which solution was proposed by the SWAN group for mobility-aware flow rule placement in mobile-based IoT systems?", "o": ["Odin", "uFlow", "MobileFlow", "Soft-WSN"], "a": 2, "why": "MobileFlow, from the SWAN group, places flow rules with user mobility in mind for mobile IoT systems.", "x": []}, {"w": 8, "q": "In the context of Data Center Networking using SDN, which type of flow requires exact match rules?", "o": ["Mice flow", "Elephant flow", "Cheetah flow", "Tortoise flow"], "a": 1, "why": "Elephant flows are large and long-lived, so they get exact-match rules; small mice flows are handled with wildcard rules.", "x": []}, {"w": 8, "q": "Cloud computing is best described as using computing as a:", "o": ["Utility", "Product", "Protocol", "None of these"], "a": 0, "why": "Cloud computing treats computing as a utility: you use resources on demand and pay for what you use, like electricity.", "x": []}, {"w": 8, "q": "Which of the following is NOT an essential characteristic of Cloud Computing?", "o": ["Rapid Elasticity", "Measured Service", "Resource Pooling", "Fixed Resource Allocation"], "a": 3, "why": "Cloud resources scale up and down on demand, so fixed resource allocation is not a cloud characteristic. Elasticity, measured service and resource pooling are.", "x": []}, {"w": 8, "q": "Which deployment model is restricted to a single organization where cloud functionalities are available only within that organization?", "o": ["Public Cloud", "Private Cloud", "Hybrid Cloud", "Community Cloud"], "a": 1, "why": "A private cloud serves a single organisation, and its services are available only inside that organisation.", "x": []}, {"w": 8, "q": "In which service model are the Applications and Data managed by the user, while the Runtime, Middleware, and OS are managed by the provider?", "o": ["SaaS", "PaaS", "IaaS", "None of these"], "a": 1, "why": "In PaaS the user manages the applications and data; the provider manages the runtime, middleware, operating system and below.", "x": []}, {"w": 8, "q": "Which service model allows customers to rent virtualized servers and associated services, focusing on infrastructure like networking and storage?", "o": ["SaaS", "PaaS", "IaaS", "XaaS"], "a": 2, "why": "IaaS lets customers rent virtual servers, storage and networking.", "x": []} l hardware to be shared among multiple entities.", "o": ["Hardware virtualization", "Software virtualization", "Module virtualization", "All of these"], "a": 0, "why": "Hardware virtualization lets one physical machine be shared by several users or virtual machines.", "x": []}, {"w": 9, "q": "Which of the following is/are advantages of fog computing?", "o": ["Anywhere deployability", "Mobility", "Both a and b", "Neither a nor b"], "a": 2, "why": "Fog computing can be deployed almost anywhere and supports mobile devices, so both (a) and (b).", "x": []}, {"w": 9, "q": "To what are the fog nodes connected?", "o": ["IoT devices", "Cloud", "Neither a nor b", "Both a and b"], "a": 3, "why": "Fog nodes connect to IoT devices below them and to the cloud above them, so both.", "x": []}, {"w": 10, "q": "Smart city is an ___ system.", "o": ["local", "rural", "home", "urban"], "a": 3, "why": "A smart city is an urban system that uses IoT to manage city services.", "x": []}, {"w": 10, "q": "Which of the following is an area of focus in smart parking lots?", "o": ["Auto-routing of vehicles", "Auto-charging of vehicles", "Detection of slots in parking lots", "All of these"], "a": 3, "why": "Smart parking covers detecting free slots, guiding vehicles to them and charging vehicles, so all of these.", "x": []}, {"w": 10, "q": "What refers to combining information from multiple sensor sources?", "o": ["Information collection", "Multi-sensor deployment", "Multi-sensor dissemination", "Multi-sensor data fusion"], "a": 3, "why": "Combining information from several sensors is called multi-sensor data fusion.", "x": []}, {"w": 10, "q": "The ensemble of all the decisions happens at the ___ level (in data fusion).", "o": ["Feature level", "Decision level", "Pixel level", "All of these"], "a": 1, "why": "In decision-level fusion, the separate decisions from each sensor are combined into a final decision.", "x": []}, {"w": 10, "q": "The smart parking system reduces traffic ___.", "o": ["mobili ng existing (legacy) infrastructure into new IIoT systems.", "x": []}, {"w": 11, "q": "State True or False. Lack of vision and leadership is not a hindrance in the path of success of IIoT.", "o": ["True", "False"], "a": 1, "why": "False. A lack of vision and leadership is a real barrier to IIoT success.", "x": []}, {"w": 11, "q": "State True or False. Big data is characterized by 7 Vs.", "o": ["True", "False"], "a": 0, "why": "True. The course describes big data with 7 Vs, for example volume, velocity, variety, veracity, variability, visualization and value.", "x": []}, {"w": 11, "q": "What is the correct flow of data processing?", "o": ["Acquisition > Generation > Storage > Analysis", "Generation > Storage > Analysis > Acquisition", "Generation > Acquisition > Storage > Analysis", "None of these"], "a": 2, "why": "Data is first generated, then acquired, stored and finally analysed.", "x": []}, {"w": 11, "q": "Hadoop is primarily used for:", "o": ["Distributed processing of large datasets", "Large clusters of computers", "All of these", "Neither a nor b"], "a": 2, "why": "Hadoop does distributed processing of large data sets across large clusters of computers, so all of these.", "x": []}, {"w": 12, "q": "The two broad types of data analysis are ___ and ___.", "o": ["Qualitative and Quantitative", "Repetitive and Quantitative", "Repetitive and Qualitative", "All of these"], "a": 0, "why": "Data analysis is broadly qualitative (descriptive) or quantitative (numerical).", "x": []}, {"w": 12, "q": "Which of the following is/are the basic principle(s) of qualitative analysis?", "o": ["Notice things", "Think about things", "Collect things", "All of these"], "a": 3, "why": "Qualitative analysis follows the cycle of noticing things, collecting things and thinking about things, so all of these.", "x": []}, {"w": 12, "q": "To perform an ANOVA, we must have a ___ response variable and at least one ___ factor.", "o": ["Discrete, categorical", "Continuous, quantitative", "Discre althcare.", "o": ["True", "False"], "a": 0, "why": "True. Remote IoT healthcare monitors patients where they are, bringing care to them.", "x": []}, {"w": 12, "q": "Which handheld device sensor pair is used for activity monitoring (as discussed)?", "o": ["EEG and GPS", "Accelerometer and EEG", "Accelerometer and GPS", "All of these"], "a": 2, "why": "Activity monitoring on handheld devices uses the accelerometer for movement and GPS for location.", "x": []}, {"w": 12, "q": "Which of the following is a property of in-place data analysis for activity monitoring?", "o": ["Power intensive", "On the device", "No need of network", "All of these"], "a": 3, "why": "In-place analysis runs on the device itself, needs no network, and uses a lot of the device's power, so all of these.", "x": []}, {"w": 12, "q": "Deep learning-based analysis cannot be performed on videos.", "o": ["True", "False"], "a": 1, "why": "False. Deep learning is widely used to analyse video, for example for activity recognition.", "x": []}, {"w": 12, "q": "Which of the following are inbuilt sensors present in high-end smartphones (as discussed)?", "o": ["ECG and EEG", "Accelerometer, proximity sensor, and EEG", "Accelerometer, Compass, and Gyroscope", "Pressure sensor and NPK sensor"], "a": 2, "why": "High-end smartphones have an accelerometer, a compass (magnetometer) and a gyroscope; ECG, EEG and NPK sensors are not built in.", "x": []}, {"w": 12, "q": "Processing the handheld activity device data using artificial intelligence can be used for ___.", "o": ["Fall detection", "Heart rate detection", "Vehicle detection", "All of these"], "a": 0, "why": "AI on activity data from handheld devices can detect falls from sudden changes in motion.", "x": []}, {"w": 12, "q": "Continuous monitoring of a person’s activity can help observe behavior and identify repetitive patterns.", "o": ["True", "False"], "a": 0, "why": "True. Continuous activity monitoring reveals behaviour and repeating patterns.", "x": []}]}];

<script>
(function () {
  if (window.__polQuizStarted) return;
  window.__polQuizStarted = true;
  const WEEK_LABEL = w => "Week " + w;
  const LETTERS = ["A", "B", "C", "D", "E", "F"];
  const app = document.getElementById("app");

  // ---------- Browser storage (all optional; the quiz works without it) ----------
  function readJSON(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function writeJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function removeKey(key) { try { localStorage.removeItem(key); } catch (e) {} }
  // Everything below is kept separately for each subject: "mp:<subject>:<name>"
  let subject = null;
  let QUESTIONS = [], WEEKS = [];
  const K = name => "mp:" + subject.id + ":" + name;
  const store = { get: () => readJSON(K("quiz"), null), set: v => writeJSON(K("quiz"), v), clear: () => removeKey(K("quiz")) };

  // Per-question stats { [id]: {c: correct, w: wrong} }, attempt history, bookmarks
  let stats = {}, history = [], bookmarks = new Set();
  const saveStats = () => writeJSON(K("stats"), stats);
  const saveHistory = () => writeJSON(K("history"), history);
  const saveBookmarks = () => writeJSON(K("bookmarks"), [...bookmarks]);

  // Psychology of Learning used these keys before the site had several subjects
  (function migrateOldKeys() {
    const map = { "pol-quiz-v1": "quiz", "pol-stats": "stats", "pol-history": "history", "pol-bookmarks": "bookmarks" };
    Object.keys(map).forEach(old => {
      const nk = "mp:psychology_of_learning:" + map[old];
      try { if (localStorage.getItem(old) != null && localStorage.getItem(nk) == null) localStorage.setItem(nk, localStorage.getItem(old)); localStorage.removeItem(old); } catch (e) {}
    });
  })();

  // ---------- Theme toggle: black (dark) by default ----------
  const themeBtn = document.getElementById("themeBtn");
  const root = document.documentElement;
  const isLight = () => root.getAttribute("data-theme") === "light";
  function setTheme(t) {
    root.setAttribute("data-theme", t);
    themeBtn.textContent = t === "light" ? "Dark mode" : "Light mode";
    try { localStorage.setItem("mp-theme", t); } catch (e) {}
  }
  themeBtn.onclick = () => setTheme(isLight() ? "dark" : "light");
  let savedTheme = "dark";
  try { savedTheme = localStorage.getItem("mp-theme") || localStorage.getItem("pol-theme") || "dark"; } catch (e) {}
  setTheme(savedTheme === "light" ? "light" : "dark");

  // ---------- Instant answer switch ----------
  const instantBtn = document.getElementById("instantBtn");
  let instant = readJSON("mp-instant", false) === true;
  function setInstant(on) {
    instant = on;
    instantBtn.setAttribute("aria-checked", String(on));
    instantBtn.title = on ? "Instant answer is on: the answer and explanation show as soon as you tap an option" : "Instant answer is off: answers are shown at the end";
    writeJSON("mp-instant", on);
  }
  instantBtn.onclick = () => {
    setInstant(!instant);
    if (run && !run.done && app.querySelector(".opts")) renderQuestion();
  };
  setInstant(instant);

  const perWeek = w => QUESTIONS.filter(q => q.w === w).length;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = ms => { const t = Math.round((ms || 0) / 1000); const m = Math.floor(t / 60), s = t % 60; return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); };
  const BM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

  function weakIds() {
    return QUESTIONS.map((q, id) => id).filter(id => {
      const s = stats[id]; if (!s || !s.w) return false;
      return s.c / (s.c + s.w) < 0.6;
    });
  }

  // ---------- State ----------
  let settings = { weeks: [], count: "all", shuffleQ: true, shuffleO: true };
  let run = null; // { items:[{id, order}], answers:[displayIdx|null], locked:[bool], i, done, elapsed, label }

  function buildRun(ids, opts) {
    opts = opts || {};
    let list = ids.slice();
    if (settings.shuffleQ) list = shuffle(list);
    const count = opts.all ? "all" : settings.count;
    if (count !== "all") list = list.slice(0, Number(count));
    const items = list.map(id => {
      const n = QUESTIONS[id].o.length;
      const base = [...Array(n).keys()];
      const isTF = n === 2 && /^true$/i.test(QUESTIONS[id].o[0]);
      return { id, order: settings.shuffleO && !isTF ? shuffle(base) : base };
    });
    run = { items, answers: items.map(() => null), locked: items.map(() => false), i: 0, done: false, elapsed: 0, label: opts.label || "Practice" };
    save();
  }
  function save() { store.set({ settings, run }); }

  // ---------- Timer (counts only while a question is on screen) ----------
  let lastTick = Date.now();
  setInterval(() => {
    const now = Date.now();
    const dt = now - lastTick; lastTick = now;
    if (!run || run.done || !app.querySelector(".opts") || document.hidden) return;
    run.elapsed = (run.elapsed || 0) + Math.min(dt, 5000);
    const el = document.getElementById("timer");
    if (el) el.textContent = fmtTime(run.elapsed);
    if (Math.floor(run.elapsed / 1000) % 5 === 0) save();
  }, 1000);

  // ---------- Start screen ----------
  function renderStart() {
    const saved = store.get();
    const canResume = saved && saved.run && !saved.run.done && saved.run.items && saved.run.items.length;
    const answeredSaved = canResume ? saved.run.answers.filter(a => a !== null).length : 0;
    const seen = Object.keys(stats).filter(id => QUESTIONS[id]).length;
    let c = 0, w = 0; Object.values(stats).forEach(s => { c += s.c || 0; w += s.w || 0; });
    const acc = c + w ? Math.round((c / (c + w)) * 100) : 0;
    const best = history.length ? Math.max(...history.map(h => h.score)) : 0;
    const weak = weakIds();
    const bms = [...bookmarks].filter(id => QUESTIONS[id]);

    app.innerHTML = `
      <section class="hero">
        <button class="linkish back" id="backHome" type="button">← All subjects</button>
        <span class="eyebrow">NPTEL · ${esc(subject.institute)}</span>
        <h1>${esc(subject.name)}</h1>
        <p>Practise all <b>${QUESTIONS.length}</b> assignment questions one at a time, with an explanation for every answer. Turn on <b>Instant answer</b> at the top to see the answer as soon as you tap, or leave it off and get your score out of 100 at the end.</p>
        <div class="stats">
          <span><b>${QUESTIONS.length}</b> questions</span>
          <span><b>${WEEKS.length}</b> weeks</span>
          <span><b>${QUESTIONS.filter(q => q.o.length === 2).length}</b> true/false</span>
        </div>
      </section>
      ${canResume ? `
      <div class="resume">
        <p><b>You have a quiz in progress.</b> ${answeredSaved} of ${saved.run.items.length} answered.</p>
        <div class="actions">
          <button class="primary" id="resumeBtn" type="button">Resume</button>
          <button class="secondary" id="discardBtn" type="button">Discard</button>
        </div>
      </div>` : ""}
      <section class="stat4" aria-label="Your progress">
        <div class="tile"><b>${seen}<small style="font-size:.7em;color:var(--muted)">/${QUESTIONS.length}</small></b><span>Questions seen</span></div>
        <div class="tile"><b>${acc}%</b><span>Accuracy</span></div>
        <div class="tile"><b>${history.length}</b><span>Quizzes taken</span></div>
        <div class="tile"><b>${best}</b><span>Best score</span></div>
      </section>
      <section class="panel">
        <div class="field">
          <div class="field-head">
            <h3>Weeks to include</h3>
            <span><button class="linkish" id="allW" type="button">Select all</button> · <button class="linkish" id="noneW" type="button">Clear</button></span>
          </div>
          <div class="chips" id="weekChips">
            ${WEEKS.map(w => `
              <label class="chip"><input type="checkbox" id="wk-${w}" value="${w}" ${settings.weeks.includes(w) ? "checked" : ""}>
              <span>${WEEK_LABEL(w)} <small>${perWeek(w)}</small></span></label>`).join("")}
          </div>
        </div>
        <div class="field">
          <div class="field-head"><h3>How many questions</h3></div>
          <div class="chips count-row" id="countChips">
            ${["10", "25", "50", "all"].map(c => `
              <label class="chip"><input type="radio" name="count" id="cnt-${c}" value="${c}" ${settings.count === c ? "checked" : ""}>
              <span>${c === "all" ? "All selected" : c}</span></label>`).join("")}
          </div>
        </div>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="shQ" ${settings.shuffleQ ? "checked" : ""}>
            <div><b>Shuffle questions</b><span>New random order every attempt</span></div></label>
          <label class="toggle"><input type="checkbox" id="shO" ${settings.shuffleO ? "checked" : ""}>
            <div><b>Shuffle options</b><span>A, B, C, D appear in a new order</span></div></label>
        </div>
        <div class="field">
          <button class="primary" id="startBtn" type="button"></button>
          <p class="note">Your progress, bookmarks and history are saved in this browser only.</p>
        </div>
      </section>
      <section class="panel">
        <h3 class="section-title">Revision</h3>
        <div class="rev">
          <div class="revcard">
            <h4>Weak questions <b>${weak.length}</b></h4>
            <p>Questions you get wrong more often than right (under 60% correct).</p>
            <button class="secondary" id="weakBtn" type="button" ${weak.length ? "" : "disabled"}>${weak.length ? "Practise weak questions" : "Nothing to drill yet"}</button>
          </div>
          <div class="revcard">
            <h4>Bookmarked <b>${bms.length}</b></h4>
            <p>Tap the Save button on any question during a quiz to keep it here.</p>
            <button class="secondary" id="bmBtn" type="button" ${bms.length ? "" : "disabled"}>${bms.length ? "Practise bookmarks" : "No bookmarks yet"}</button>
          </div>
        </div>
      </section>
      ${history.length ? `
      <section class="panel">
        <div class="field-head"><h3 class="section-title">Recent quizzes</h3><button class="linkish danger" id="resetBtn" type="button">Reset my progress</button></div>
        <div id="resetConfirm" hidden class="confirm"><p><b>Delete your stats, history and bookmarks?</b> This can't be undone.</p>
          <div class="row"><button class="primary" id="resetYes" type="button">Yes, reset</button><button class="secondary" id="resetNo" type="button">Cancel</button></div></div>
        <div class="hist">
          ${history.slice(0, 8).map(h => `
            <div class="hrow"><span class="when">${esc(h.label || "Practice")} · ${new Date(h.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })}, ${new Date(h.at).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</span>
            <span>${h.correct}/${h.total} · ${fmtTime(h.ms)}</span><b>${h.score}</b></div>`).join("")}
        </div>
      </section>` : ""}`;

    const startBtn = document.getElementById("startBtn");
    function readSettings() {
      settings.weeks = [...app.querySelectorAll("#weekChips input:checked")].map(i => Number(i.value));
      settings.count = (app.querySelector("#countChips input:checked") || {}).value || "all";
      settings.shuffleQ = document.getElementById("shQ").checked;
      settings.shuffleO = document.getElementById("shO").checked;
      const pool = QUESTIONS.filter(q => settings.weeks.includes(q.w)).length;
      const n = settings.count === "all" ? pool : Math.min(pool, Number(settings.count));
      startBtn.textContent = pool ? `Start quiz · ${n} question${n === 1 ? "" : "s"}` : "Pick at least one week";
      startBtn.disabled = !pool;
    }
    app.querySelector(".panel:not(.stat4)").addEventListener("change", readSettings);
    document.getElementById("allW").onclick = () => { app.querySelectorAll("#weekChips input").forEach(i => i.checked = true); readSettings(); };
    document.getElementById("noneW").onclick = () => { app.querySelectorAll("#weekChips input").forEach(i => i.checked = false); readSettings(); };
    startBtn.onclick = () => {
      readSettings();
      const ids = QUESTIONS.map((q, id) => id).filter(id => settings.weeks.includes(QUESTIONS[id].w));
      const label = settings.weeks.length === WEEKS.length ? "All weeks" : settings.weeks.length === 1 ? WEEK_LABEL(settings.weeks[0]) : settings.weeks.length + " weeks";
      buildRun(ids, { label });
      renderQuestion();
    };
    document.getElementById("weakBtn").onclick = () => { buildRun(weakIds(), { all: true, label: "Weak questions" }); renderQuestion(); };
    document.getElementById("bmBtn").onclick = () => { buildRun([...bookmarks].filter(id => QUESTIONS[id]), { all: true, label: "Bookmarks" }); renderQuestion(); };
    if (canResume) {
      document.getElementById("resumeBtn").onclick = () => { settings = saved.settings || settings; run = saved.run; run.locked = run.locked || run.items.map(() => false); renderQuestion(); };
      document.getElementById("discardBtn").onclick = () => { store.clear(); renderStart(); };
    }
    const resetBtn = document.getElementById("resetBtn");
    if (resetBtn) {
      const box = document.getElementById("resetConfirm");
      resetBtn.onclick = () => { box.hidden = false; };
      document.getElementById("resetNo").onclick = () => { box.hidden = true; };
      document.getElementById("resetYes").onclick = () => {
        stats = {}; history = []; bookmarks = new Set();
        saveStats(); saveHistory(); saveBookmarks(); renderStart();
      };
    }
    document.getElementById("backHome").onclick = goHome;
    readSettings();
  }

  // ---------- Home: pick a subject ----------
  function subjectSummary(sj) {
    const st = readJSON("mp:" + sj.id + ":stats", {});
    const hist = readJSON("mp:" + sj.id + ":history", []);
    let c = 0, w = 0; Object.values(st).forEach(s => { c += s.c || 0; w += s.w || 0; });
    const saved = readJSON("mp:" + sj.id + ":quiz", null);
    const inProgress = !!(saved && saved.run && !saved.run.done);
    return { seen: Object.keys(st).length, acc: c + w ? Math.round((c / (c + w)) * 100) : null, taken: hist.length, inProgress };
  }
  function renderHome() {
    subject = null; run = null;
    setSubtitle("");
    const total = SUBJECTS.reduce((n, sj) => n + sj.questions.length, 0);
    app.innerHTML = `
      <section class="hero">
        <span class="eyebrow">NPTEL assignment practice</span>
        <h1>MOOC <em>Practice</em></h1>
        <p>Pick a subject and practise every weekly assignment question, with shuffled questions and options, instant answers, explanations and a score out of 100.</p>
        <div class="stats"><span><b>${SUBJECTS.length}</b> subjects</span><span><b>${total}</b> questions</span></div>
      </section>
      <section class="subjects">
        ${SUBJECTS.map(sj => {
          const sm = subjectSummary(sj);
          const weeks = [...new Set(sj.questions.map(q => q.w))].sort((a, b) => a - b);
          return `
          <button class="subj" type="button" data-id="${sj.id}">
            <span class="subj-badge">${esc(sj.short)}</span>
            <span class="subj-body">
              <span class="subj-name">${esc(sj.name)}</span>
              <span class="subj-meta">${esc(sj.institute)} · Weeks ${weeks[0]}–${weeks[weeks.length - 1]} · ${sj.questions.length} questions</span>
              <span class="subj-prog">${sm.inProgress ? `<b>Quiz in progress</b> · ` : ""}${sm.seen}/${sj.questions.length} seen${sm.acc === null ? "" : ` · ${sm.acc}% accuracy`}${sm.taken ? ` · ${sm.taken} quiz${sm.taken === 1 ? "" : "zes"}` : ""}</span>
            </span>
            <span class="subj-go" aria-hidden="true">→</span>
          </button>`;
        }).join("")}
      </section>`;
    app.querySelectorAll(".subj").forEach(b => b.onclick = () => openSubject(b.dataset.id, true));
  }

  // ---------- Question screen ----------
  function correctCount() {
    return run.items.reduce((n, it, k) => n + (run.answers[k] !== null && it.order[run.answers[k]] === QUESTIONS[it.id].a ? 1 : 0), 0);
  }
  function feedbackHTML(q, it, d) {
    const correctD = it.order.indexOf(q.a);
    const ok = d === correctD;
    const chosen = it.order[d];
    return `
      <div class="fb ${ok ? "ok" : ""}" role="status">
        <span class="fb-title">${ok ? "Correct" : "Incorrect"}</span>
        ${ok ? "" : `<p><span class="pill">Correct answer: ${LETTERS[correctD]}</span>${esc(q.o[q.a])}</p>`}
        <p><b>Explanation:</b> ${esc(q.why || "")}</p>
        ${ok || !q.x || !q.x[chosen] ? "" : `<p><b>Explanation of ${LETTERS[d]} (your answer):</b> ${esc(q.x[chosen])}</p>`}
      </div>`;
  }
  function renderQuestion(showConfirm) {
    const total = run.items.length;
    const it = run.items[run.i];
    const q = QUESTIONS[it.id];
    const sel = run.answers[run.i];
    if (instant && sel !== null) run.locked[run.i] = true;
    const reveal = sel !== null && run.locked[run.i];
    const correctD = it.order.indexOf(q.a);
    const answered = run.answers.filter(a => a !== null).length;
    const last = run.i === total - 1;
    const unanswered = total - answered;
    const marked = bookmarks.has(it.id);

    app.innerHTML = `
      <section class="progress" aria-label="Progress">
        <div class="progress-meta"><span class="mono">${esc(run.label || "Practice")} · Q ${run.i + 1}/${total}</span><span class="mono">Time <span id="timer">${fmtTime(run.elapsed)}</span></span></div>
        <div class="bar"><i style="width:${(answered / total) * 100}%"></i></div>
      </section>
      <article class="card">
        <div class="qhead">
          <div class="qmeta"><span class="tag">${WEEK_LABEL(q.w)}</span>
            <button class="bm" id="bmToggle" type="button" aria-pressed="${marked}">${BM_ICON}${marked ? "Saved" : "Save"}</button></div>
          ${instant ? `<span class="score-so-far">${correctCount()} correct so far</span>` : `<span class="qnum mono">${String(run.i + 1).padStart(2, "0")}</span>`}
        </div>
        <div class="qtext" id="qtext">${esc(q.q)}</div>
        <div class="opts" role="radiogroup" aria-labelledby="qtext">
          ${it.order.map((oi, di) => {
            const cls = reveal ? (di === correctD ? "is-right" : di === sel ? "is-wrong" : "") : "";
            const mark = reveal ? (di === correctD ? "Correct" : di === sel ? "Your answer" : "") : "";
            return `
            <button type="button" class="opt ${cls}" role="radio" id="opt-${di}" data-d="${di}" aria-checked="${sel === di}" ${reveal ? "disabled" : ""}>
              <span class="key">${LETTERS[di]}</span><span class="txt">${esc(q.o[oi])}</span>${mark ? `<span class="mark">${mark}</span>` : ""}
            </button>`;
          }).join("")}
        </div>
        ${reveal ? feedbackHTML(q, it, sel) : ""}
        ${showConfirm ? `
        <div class="confirm" role="alert">
          <p><b>${unanswered} question${unanswered === 1 ? " is" : "s are"} still unanswered.</b> Unanswered questions count as wrong.</p>
          <div class="row">
            <button class="primary" id="finishAnyway" type="button">Finish and see score</button>
            <button class="secondary" id="gotoFirst" type="button">Go to first unanswered</button>
          </div>
        </div>` : ""}
        <div class="nav">
          <button class="secondary" id="prevBtn" type="button" ${run.i === 0 ? "disabled" : ""}>Previous</button>
          <div class="right">
            ${last ? "" : `<button class="ghost" id="endBtn" type="button">Finish now</button>`}
            <button class="primary" id="nextBtn" type="button">${last ? "Finish quiz" : sel === null ? "Skip" : "Next"}</button>
          </div>
        </div>
        <span class="hint">${instant ? "Instant answer is on: tap an option to see if it's right." : "Tip: press A–D or 1–4 to choose, Enter for next."}</span>
      </article>
      <div><button class="linkish" id="quitBtn" type="button">Quit to start screen</button></div>`;

    app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(Number(b.dataset.d)));
    document.getElementById("prevBtn").onclick = () => go(run.i - 1);
    document.getElementById("nextBtn").onclick = next;
    const endBtn = document.getElementById("endBtn");
    if (endBtn) endBtn.onclick = tryFinish;
    document.getElementById("quitBtn").onclick = () => { save(); renderStart(); };
    document.getElementById("bmToggle").onclick = () => {
      if (bookmarks.has(it.id)) bookmarks.delete(it.id); else bookmarks.add(it.id);
      saveBookmarks();
      const b = document.getElementById("bmToggle"), on = bookmarks.has(it.id);
      b.setAttribute("aria-pressed", String(on)); b.innerHTML = BM_ICON + (on ? "Saved" : "Save");
    };
    if (showConfirm) {
      document.getElementById("finishAnyway").onclick = finish;
      document.getElementById("gotoFirst").onclick = () => go(run.answers.findIndex(a => a === null));
    }
  }
  function choose(d) {
    if (run.locked[run.i]) return;
    run.answers[run.i] = d;
    if (instant) {
      run.locked[run.i] = true; save();
      renderQuestion();
      const fb = app.querySelector(".fb");
      if (fb && fb.getBoundingClientRect().bottom > window.innerHeight) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
      return;
    }
    save();
    app.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-checked", String(Number(b.dataset.d) === d)));
    const nb = document.getElementById("nextBtn");
    if (nb && nb.textContent === "Skip") nb.textContent = "Next";
    const answered = run.answers.filter(a => a !== null).length;
    app.querySelector(".bar i").style.width = (answered / run.items.length) * 100 + "%";
  }
  function go(i) { if (i < 0 || i >= run.items.length) return; run.i = i; save(); renderQuestion(); window.scrollTo({ top: 0 }); }
  function next() { if (run.i === run.items.length - 1) tryFinish(); else go(run.i + 1); }
  function tryFinish() {
    if (run.answers.some(a => a === null)) { renderQuestion(true); document.querySelector(".confirm").scrollIntoView({ block: "center" }); }
    else finish();
  }

  // ---------- Results ----------
  function finish() {
    run.done = true;
    if (!run.recorded) {
      const g = grade();
      g.forEach(x => {
        if (x.skipped) return;
        const s = stats[x.it.id] || (stats[x.it.id] = { c: 0, w: 0 });
        if (x.ok) s.c++; else s.w++;
      });
      const correct = g.filter(x => x.ok).length;
      history.unshift({ at: Date.now(), label: run.label || "Practice", correct, total: g.length, score: Math.round((correct / g.length) * 1000) / 10, ms: run.elapsed || 0 });
      history = history.slice(0, 50);
      saveStats(); saveHistory();
      run.recorded = true;
    }
    save();
    renderResults("wrong");
    window.scrollTo({ top: 0 });
  }
  function grade() {
    return run.items.map((it, k) => {
      const q = QUESTIONS[it.id];
      const d = run.answers[k];
      const correctD = it.order.indexOf(q.a);
      return { k, q, it, d, correctD, ok: d === correctD, skipped: d === null };
    });
  }
  function whyHTML(x) {
    const q = x.q;
    const chosen = x.d === null ? null : x.it.order[x.d];
    const others = x.it.order.map((oi, di) => ({ oi, di })).filter(o => o.oi !== q.a && o.oi !== chosen && q.x && q.x[o.oi]);
    return `
      <div class="why">
        <p><span class="wl g">Explanation · ${LETTERS[x.correctD]} is correct</span>${esc(q.why || "")}</p>
        ${!x.ok && !x.skipped && q.x && q.x[chosen] ? `<p><span class="wl r">Explanation · your answer ${LETTERS[x.d]} is wrong</span>${esc(q.x[chosen])}</p>` : ""}
        ${others.length ? `<details><summary>Explanation of the other options</summary><ul>${others.map(o => `<li><b>${LETTERS[o.di]}.</b> ${esc(q.x[o.oi])}</li>`).join("")}</ul></details>` : ""}
      </div>`;
  }
  function renderResults(tab) {
    const g = grade();
    const total = g.length;
    const correct = g.filter(x => x.ok).length;
    const skipped = g.filter(x => x.skipped).length;
    const wrong = total - correct - skipped;
    const pct = total ? (correct / total) * 100 : 0;
    const score = Math.round(pct * 10) / 10;
    const C = 2 * Math.PI * 64;
    const verdict = pct >= 90 ? "Excellent work" : pct >= 75 ? "Well done" : pct >= 50 ? "Good effort, keep going" : "Keep practising";
    const misses = g.filter(x => !x.ok);
    const shown = tab === "all" ? g : misses;

    app.innerHTML = `
      <section class="card">
        <div class="score">
          <div class="ring" aria-label="Score ${score} out of 100">
            <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="12"/>
              <circle cx="75" cy="75" r="64" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg>
            <div class="val"><div><b>${score}</b><small>out of 100</small></div></div>
          </div>
          <div class="verdict">
            <span class="eyebrow">${esc(run.label || "Your result")}</span>
            <h2>${verdict}</h2>
            <p>You got <b>${correct}</b> correct out of <b>${total}</b> questions in <b>${fmtTime(run.elapsed)}</b>.</p>
          </div>
        </div>
        <div class="tally">
          <div class="tile good"><b>${correct}</b><span>Correct</span></div>
          <div class="tile bad"><b>${wrong}</b><span>Wrong</span></div>
          <div class="tile"><b>${skipped}</b><span>Skipped</span></div>
        </div>
        <div class="actions">
          ${misses.length ? `<button class="primary" id="retryWrong" type="button">Retry my ${misses.length} mistake${misses.length === 1 ? "" : "s"}</button>` : ""}
          <button class="secondary" id="again" type="button">New shuffled attempt</button>
          <button class="secondary" id="settingsBtn" type="button">Back to start</button>
        </div>
      </section>
      <section class="review-wrap" style="display:flex;flex-direction:column;gap:14px">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-wrong" aria-selected="${tab !== "all"}" type="button">Wrong answers (${misses.length})</button>
          <button class="tab" role="tab" id="tab-all" aria-selected="${tab === "all"}" type="button">All questions (${total})</button>
        </div>
        <div class="review">
          ${shown.length ? shown.map(x => `
            <div class="ritem ${x.ok ? "ok" : ""}">
              <div class="meta"><span>Q${x.k + 1}</span><span>·</span><span>${WEEK_LABEL(x.q.w)}</span><span>·</span><span>${x.ok ? "Correct" : x.skipped ? "Skipped" : "Wrong"}</span></div>
              <div class="rq">${esc(x.q.q)}</div>
              <div class="ropts">
                ${x.it.order.map((oi, di) => {
                  const cls = di === x.correctD ? "right" : di === x.d ? "wrong" : "";
                  const tag = di === x.correctD ? (di === x.d ? "Your answer · Correct" : "Correct answer") : di === x.d ? "Your answer" : "";
                  return `<div class="ropt ${cls}"><span class="key">${LETTERS[di]}</span><span class="txt">${esc(x.q.o[oi])}</span>${tag ? `<span class="rtag">${tag}</span>` : ""}</div>`;
                }).join("")}
              </div>
              ${x.skipped ? `<div class="ans skip"><span class="lbl">Skipped</span><span>You did not answer this question.</span></div>` : ""}
              ${whyHTML(x)}
            </div>`).join("")
          : `<div class="empty">No wrong answers. Every question was correct.</div>`}
        </div>
      </section>`;

    document.getElementById("tab-wrong").onclick = () => renderResults("wrong");
    document.getElementById("tab-all").onclick = () => renderResults("all");
    const rw = document.getElementById("retryWrong");
    if (rw) rw.onclick = () => {
      buildRun(misses.map(x => x.it.id), { all: true, label: "Retry mistakes" });
      renderQuestion(); window.scrollTo({ top: 0 });
    };
    document.getElementById("again").onclick = () => {
      const ids = QUESTIONS.map((q, id) => id).filter(id => settings.weeks.includes(QUESTIONS[id].w));
      buildRun(ids, { label: run.label }); renderQuestion(); window.scrollTo({ top: 0 });
    };
    document.getElementById("settingsBtn").onclick = () => { store.clear(); run = null; renderStart(); window.scrollTo({ top: 0 }); };
  }

  // ---------- Navigation between subjects ----------
  const subtitleEl = document.getElementById("brandSub");
  function setSubtitle(t) { if (subtitleEl) { subtitleEl.textContent = t; subtitleEl.hidden = !t; } }
  function leaveQuiz() {
    if (!subject) return;
    if (run && !run.done) save();
    else if (run && run.done) store.clear();
  }
  function setHash(h) {
    if (location.hash.replace("#", "") === h) return;
    try { window.history.pushState(null, "", h ? "#" + h : location.pathname + location.search); }
    catch (e) { try { location.hash = h; } catch (e2) {} }
  }
  function openSubject(id, push) {
    const sj = SUBJECTS.find(x => x.id === id);
    if (!sj) { renderHome(); return; }
    leaveQuiz();
    subject = sj;
    QUESTIONS = sj.questions;
    WEEKS = [...new Set(QUESTIONS.map(q => q.w))].sort((a, b) => a - b);
    stats = readJSON(K("stats"), {});
    history = readJSON(K("history"), []);
    bookmarks = new Set(readJSON(K("bookmarks"), []));
    settings = { weeks: WEEKS.slice(), count: "all", shuffleQ: true, shuffleO: true };
    run = null;
    const saved = store.get();
    if (saved && saved.settings) settings = Object.assign(settings, saved.settings, { weeks: (saved.settings.weeks || WEEKS).filter(w => WEEKS.includes(w)) });
    if (!settings.weeks.length) settings.weeks = WEEKS.slice();
    setSubtitle(sj.name);
    if (push) setHash(sj.id);
    if (saved && saved.run && saved.run.done) { run = saved.run; renderResults("wrong"); }
    else renderStart();
    window.scrollTo({ top: 0 });
  }
  function goHome() {
    leaveQuiz();
    setHash("");
    renderHome();
    window.scrollTo({ top: 0 });
  }

  // Logo goes to the subject list (an unfinished quiz is saved and can be resumed)
  document.getElementById("homeBtn").onclick = goHome;
  window.addEventListener("popstate", route);
  window.addEventListener("hashchange", route);
  function route() {
    const id = location.hash.replace("#", "");
    if (subject && subject.id === id) return;
    if (id && SUBJECTS.some(x => x.id === id)) openSubject(id, false);
    else if (subject) { leaveQuiz(); renderHome(); }
  }

  // Keyboard shortcuts on the question screen
  document.addEventListener("keydown", e => {
    if (!run || run.done || !app.querySelector(".opts")) return;
    if (e.target.matches && e.target.matches("input, textarea")) return;
    const k = e.key.toUpperCase();
    const n = run.items[run.i].order.length;
    let d = LETTERS.indexOf(k);
    if (d < 0 && /^[1-9]$/.test(k)) d = Number(k) - 1;
    if (d >= 0 && d < n && !e.metaKey && !e.ctrlKey) { e.preventDefault(); choose(d); return; }
    const onButton = e.target.closest && e.target.closest("button");
    if (e.key === "Enter" && !onButton) { e.preventDefault(); next(); }
    if (e.key === "ArrowRight" && !onButton) next();
    if (e.key === "ArrowLeft" && !onButton) go(run.i - 1);
  });

  // Boot: open the subject named in the link (#subject_id), else the subject list
  const startId = location.hash.replace("#", "");
  if (startId && SUBJECTS.some(x => x.id === startId)) openSubject(startId, false);
  else renderHome();
})();

</script>

</body>
</html>
