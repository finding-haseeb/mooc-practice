rection.", "Reading to speaking is a language skill, not ESD.", "Moving from knowing to ignoring would mean less learning; ESD aims for active, learner-centred learning."]}, {"w": 12, "q": "___ competency is the ability to reflect on one’s own role in the local community and (global) society.", "o": ["collaboration", "self-awareness", "strategic", "normative"], "a": 1, "why": "Self-awareness competency is reflecting on your own role in your community and in global society.", "x": ["Collaboration competency is about working with others.", null, "Strategic competency is about planning and acting.", "Normative competency is about values and norms."]}]}, {"id": "introduction_to_internet_of_things", "name": "Introduction to Internet of Things", "institute": "IIT Kharagpur", "short": "IoT", "store": "introduction_to_internet_of_things_v2", "questions": [{"w": 0, "q": "Which of the following best describes a computer network?", "o": ["A collection of independent computers that cannot communicate", "A group of interconnected devices that can exchange data", "A single computer running multiple programs", "A storage device connected only to a monitor"], "a": 1, "why": "A computer network is a group of interconnected devices that can exchange data with each other.", "x": []}, {"w": 0, "q": "Which of the following are examples of network communication media?", "o": ["Twisted pair cable", "Optical fiber", "Wireless radio communication", "CPU register"], "a": [0, 1, 2], "why": "Twisted pair cable, optical fiber and wireless radio all carry data between devices. A CPU register is storage inside the processor, not a communication medium.", "x": []}, {"w": 0, "q": "State whether the following statement is True or False. Statement: A protocol is a set of rules that defines how data is exchanged between communicating devices.", "o": ["True", "False"], "a": 0, "why": "True. A protocol is an agreed set of rules for formatting, sending and receiving data between devices.", "x": []}, {"w": 0, "q": "Which layer of the TCP/IP model is mainly responsible for logical addressing and routing of packets?", "o": ["Application layer", "Transport layer", "Network layer", "Physical layer"], "a": 2, "why": "The network (Internet) layer handles logical (IP) addressing and routes packets between networks.", "x": []}, {"w": 0, "q": "Which of the following correctly distinguishes TCP and UDP?", "o": ["TCP is connection-oriented, while UDP is connectionless", "UDP guarantees reliable delivery, while TCP does not", "TCP provides reliability using acknowledgements and retransmissions", "UDP generally has lower overhead than TCP"], "a": [0, 2, 3], "why": "TCP sets up a connection and makes delivery reliable with acknowledgements and retransmissions. UDP is connectionless with less overhead, but it does not guarantee delivery, so option b is wrong.", "x": []}, {"w": 0, "q": "An IP address is primarily used to:", "o": ["Identify a device/interface on a network", "Store application data permanently", "Convert analog signals into digital signals", "Supply electrical power to sensors"], "a": 0, "why": "An IP address identifies a device or network interface so that data can be delivered to it.", "x": []}, {"w": 0, "q": "State whether the following statement is True or False. Statement: A router is used to forward packets between different networks.", "o": ["True", "False"], "a": 0, "why": "True. A router connects different networks and forwards packets between them towards their destination.", "x": []}, {"w": 0, "q": "Which of the following are basic components of an embedded system?", "o": ["Microcontroller or microprocessor", "Memory", "Input/output interfaces", "Printer cartridge only"], "a": [0, 1, 2], "why": "An embedded system is built around a microcontroller or microprocessor, memory and input/output interfaces. A printer cartridge is not a basic component.", "x": []}, {"w": 0, "q": "A microcontroller usually contains:", "o": ["CPU", "Memory", "Input/output ports", "Only a display screen"], "a": [0, 1, 2], "why": "A microcontroller is a small computer on one chip with a CPU, memory and input/output ports. It does not need a display screen.", "x": []}, {"w": 0, "q": "State whether the following statement is True or False. Statement: Sensors are used to collect information from the physical environment.", "o": ["True", "False"], "a": 0, "why": "True. Sensors measure physical quantities such as temperature, light or motion and turn them into signals.", "x": []}, {"w": 0, "q": "Which of the following is an example of an actuator?", "o": ["Motor", "Relay", "Valve", "Temperature reading"], "a": [0, 1, 2], "why": "Motors, relays and valves act on the physical world when given a control signal, so they are actuators. A temperature reading is sensor data, not an actuator.", "x": []}, {"w": 0, "q": "An Analog-to-Digital Converter, ADC, is used to:", "o": ["Convert analog signals into digital values", "Convert IP addresses into MAC addresses", "Store data permanently in cloud storage", "Generate wireless signals without input"], "a": 0, "why": "An ADC converts a continuous analog signal, such as a sensor voltage, into digital values a processor can use.", "x": []}, {"w": 0, "q": "State True or False. Statement: Cloud computing can provide storage and processing resources for IoT data.", "o": ["False", "True"], "a": 1, "why": "True. The cloud gives IoT systems on-demand storage and processing for the data their devices produce.", "x": []}, {"w": 0, "q": "Which of the following are common challenges in IoT and networked systems?", "o": ["Security", "Privacy", "Scalability", "No requirement of communication"], "a": [0, 1, 2], "why": "Security, privacy and scalability are major challenges for IoT. IoT depends on communication, so 'no requirement of communication' is not a challenge.", "x": []}, {"w": 0, "q": "In binary number representation, the decimal number 5 is written as:", "o": ["101", "110", "111", "100"], "a": 0, "why": "5 = 4 + 1 = 1×2² + 0×2¹ + 1×2⁰, so it is 101 in binary.", "x": []}, {"w": 1, "q": "According to the ITU Internet Report 2005 discussed in the lecture, the future Internet is expected to become wider and more complex mainly because:", "o": ["Humans will completely stop using the Internet", "Most Internet traffic may flow between devices and different kinds of things", "Only desktop computers will remain connected", "Internet communication will be restricted to email services"], "a": 1, "why": "The ITU report describes a future where humans may become a minority as generators and receivers of traffic. Instead, communication will increasingly happen between devices and “things,” forming the Internet of Things.", "x": []}, {"w": 1, "q": "Which of the following are characteristics of IoT systems?", "o": ["Efficient and scalable architecture", "Unambiguous naming and addressing", "Presence of sleeping nodes, mobile nodes, and non-IP devices", "Guaranteed continuous connectivity for every device at all times"], "a": [0, 1, 2], "why": "IoT systems require scalable architecture, clear naming and addressing, and must support heterogeneous devices such as sleeping nodes, mobile nodes, and non-IP devices. However, IoT systems may have intermittent connectivity, so option d is incorrect.", "x": []}, {"w": 1, "q": "In the lecture, “Smart Dust” refers to:", "o": ["A cloud storage model for IoT data", "A large-scale wireless router used in smart cities", "Very tiny computing devices that can be sprayed or injected for sensing purposes", "A type of IPv6 address used in IoT networks"], "a": 2, "why": "Smart Dust refers to extremely small computing devices, smaller than a grain of sand, that can be used to measure chemicals in soil or diagnose problems in the human body.", "x": []}, {"w": 1, "q": "Which statement best explains the relation between IoT and M2M communication?", "o": ["IoT and M2M are exactly the same", "M2M is broader than IoT because it includes people and applications", "M2M is a part of IoT, while IoT has a broader scope of interactions", "IoT does not include machine-to-machine interaction"], "a": 2, "why": "M2M focuses mainly on communication among machines and devices. IoT is broader because it includes interactions between things, people, applications, and systems.", "x": []}, {"w": 1, "q": "State whether the following statement is True or False. Statement: In the Web of Things, IoT sensors are replaced completely by cloud databases.", "o": ["True", "False"], "a": 1, "why": "The Web of Things does not replace sensors. Sensors remain responsible for collecting physical-world data, while web technologies help expose and access IoT resources.", "x": []}, {"w": 1, "q": "In an IoT network configuration, local addresses may be valid only within a gateway’s domain. The same local address may even appear under another gateway. The main advantage of this strategy is:", "o": ["It increases unnecessary address consumption", "It helps conserve address space", "It removes the requirement of a gateway", "It prevents any device from communicating with the Internet"], "a": 1, "why": "Using locally valid addresses within a gateway’s domain allows address reuse across different gateway domains. This helps avoid unnecessary wastage of global addresses.", "x": []}, {"w": 1, "q": "Which of the following functions are associated with IoT gateways in the addressing strategy discussed in the lecture?", "o": ["Providing Internet connectivity", "Supporting IoT LAN intra-connectivity", "Obtaining upstream address prefixes using mechanisms such as DHCPv6", "Delegating addresses to nodes using SLAAC"], "a": [0, 1, 2, 3], "why": "IoT gateways can provide Internet connectivity and IoT LAN intra-connectivity. They may obtain upstream prefixes through DHCPv6 and delegate them to nodes using SLAAC.", "x": []}, {"w": 1, "q": "Which of the following is true about IPv6 compared to IPv4?", "o": ["IPv6 uses dotted decimal notation", "IPv6 has a smaller address space than IPv4", "IPv6 uses hexadecimal notation and supports a much larger address space", "IPv6 requires broadcast addresses in the same way as IPv4"], "a": 2, "why": "IPv4 uses 32-bit addresses and dotted decimal notation, whereas IPv6 uses 128-bit addresses and hexadecimal notation. This makes IPv6 more suitable for large-scale IoT addressing.", "x": []}, {"w": 1, "q": "Which statement correctly represents the design expectation from a good sensor?", "o": ["It should influence the measured property significantly", "It should respond strongly to unrelated physical properties", "It should be sensitive to the measured property and should not disturb it", "It should always produce random output"], "a": 2, "why": "A good sensor should measure the desired property, remain insensitive to unrelated properties, and should not influence or alter the measured quantity.", "x": []}, {"w": 1, "q": "Which of the following statements about sensor resolution are correct?", "o": ["Sensor resolution is the smallest change that the sensor can detect", "For a digital sensor, resolution is related to the smallest digital output change it can process", "Sensor resolution and sensor accuracy always refer to exactly the same property", "Sensor accuracy does not depend only on resolution"], "a": [0, 1, 3], "why": "Resolution refers to the smallest detectable change in the measured quantity. In digital sensors, it is related to the smallest digital output step. However, accuracy and resolution are not the same; a high-resolution sensor may still be inaccurate if it has bias or calibration errors.", "x": []}, {"w": 1, "q": "State True or False. An accelerometer that measures acceleration along the x, y, and z coordinate axes is classified as a vector sensor.", "o": ["True", "False"], "a": 0, "why": "A vector sensor measures quantities that have both magnitude and direction or orientation. Since an accelerometer measures acceleration compo nents along different coordinate axes, such as x, y, and z, it is classified as a vector sensor.", "x": []}, {"w": 1, "q": "A sensor gives different output for the same input value depending on whether that input was reached by increasing or decreasing the measured quantity. This error is called:", "o": ["Quantization error", "Hysteresis error", "IPv6 translation error", "Gateway prefix error"], "a": 1, "why": "Hysteresis error occurs when the sensor output depends on the previous input history. The same present input may give different readings depending on whether the input was approached from a lower or higher value.", "x": []}, {"w": 1, "q": "State True or False A hydraulic actuator can produce considerable force because liquids are nearly incompressible.", "o": ["False", "True"], "a": 1, "why": "A hydraulic actuator uses hydraulic fluid to generate mechanical motion. Since liquids are nearly incompressible, hydraulic actuators can exert large forces.", "x": []}, {"w": 1, "q": "Which of the following statements are correct about Shape Memory Polymer actuators?", "o": ["They may respond to stimuli such as light, heat, electrical, magnetic, pH, or moisture changes", "They can show high strain recovery", "They may have properties such as low density and biocompatibility", "They are used only as passive temperature sensors"], "a": [0, 1, 2], "why": "Shape Memory Polymer actuators can respond to different stimuli and are known for features such as low density, high strain recovery, biocomp atibility, and biodegradability. They are actuator materials, not merely passive temperature sensors.", "x": []}, {"w": 1, "q": "State whether the following statement is True or False. Statement: According to the IoT implementation example discussed in the lecture, data gathered by a sensor travels through a gateway and a proxy server before arriving at the cloud server.", "o": ["True", "False"], "a": 0, "why": "In the example IoT implementation, the sensor first collects the data. The data then passes through the gateway and proxy server before reaching the cloud server for further processing and analytics.", "x": []}, {"w": 2, "q": "In MQTT, which field of a published message is used by the broker as routing information?", "o": ["Topic", "Client identifier", "Payload length", "Session timer"], "a": 0, "why": "The MQTT broker dispatches messages between senders and receivers. The topic included in a published message provides the routing information that the broker uses to deliver the message to clients subscribed to the matching topic.", "x": []}, {"w": 2, "q": "Which of the following statements about MQTT topic wildcards are correct?", "o": ["The plus sign (+) matches an arbitrary value at exactly one hierarchy level.", "The hash sign (#) can be used to subscribe to all underlying hierarchy levels.", "The subscription house/# matches only the exact topic house.", "The subscription house/+/temperature can match house/kitchen/temperature."], "a": [0, 1, 3], "why": "The plus sign (+) is a single-level wildcard, whereas the hash sign (#) is a multilevel wildcard. Thus, house/+/temperature can match house/kitchen/temperature, and house/# matches all topics whose hierarchy begins with house, not only the exact topic house.", "x": []}, {"w": 2, "q": "Which of the following are main stages of Secure MQTT (SMQTT)?", "o": ["Setup", "Publish", "Decryption", "Route discovery"], "a": [0, 1, 2], "why": "SMQTT consists of four main stages: setup, encryption, publish, and decryption. Route discovery is not one of the SMQTT stages.", "x": []}, {"w": 2, "q": "At the transport layer, CoAP (Constrained Application Protocol) operates over which protocol?", "o": ["TCP", "UDP", "SCTP", "FTP"], "a": 1, "why": "CoAP is designed for constrained environments and operates over UDP at the transport layer. Its lightweight design helps reduce communication overhead for resource-constrained IoT devices.", "x": []}, {"w": 2, "q": "State True or False. In CoAP, a piggyback response is carried with the acknowledgment, whereas in the separate mode, the server response is sent in a message separate from the acknowledgment.", "o": ["True", "False"], "a": 0, "why": "In the piggyback mode, the server places its response in the acknowledgment message. In the separate mode, the acknowledgment is sent first and the response is transmitted later as a separate message.", "x": []}, {"w": 2, "q": "Which of the following CoAP request-method mappings are correct?", "o": ["GET - retrieve data", "PUT - create data", "PUSH - update data", "DELETE - delete data"], "a": [0, 1, 2, 3], "why": "As presented in the lecture, CoAP uses GET, PUT, PUSH, and DELETE requests to retrieve, create, update, and delete data, respectively.", "x": []}, {"w": 2, "q": "Which AMQP frame type is used to control the message-flow rate?", "o": ["Transfer", "Detach", "Disposition", "Flow"], "a": 3, "why": "The Flow frame controls the rate of message flow between AMQP peers. By comparison, Transfer carries messages, Disposition communicates a change in transfer state, and Detach terminates a link.", "x": []}, {"w": 2, "q": "Which of the following statements about AMQP components are correct?", "o": ["An exchange receives messages and routes them to queues.", "A queue stores messages for business processes or consumers.", "A binding specifies message-distribution rules between an exchange and queues.", "A consumer must route every producer message before it reaches an exchange."], "a": [0, 1, 2], "why": "The main AMQP components discussed in the lecture are exchanges, queues, and bindings. An exchange receives and routes messages, a queue stores messages for consumers or business processes, and a binding defines the distribution rules connecting exchanges to queues.", "x": []}, {"w": 2, "q": "Which of the following IEEE 802.15.4 variant-application pairs are correct?", "o": ["IEEE 802.15.4c - China", "IEEE 802.15.4e - Industrial applications", "IEEE 802.15.4f - Active RFID", "IEEE 802.15.4g - Smart utility networks"], "a": [0, 1, 2, 3], "why": "The lecture associates IEEE 802.15.4c with China, 802.15.4d with Japan, 802.15.4e with industrial applications, 802.15.4f with active RFID, and 802.15.4g with smart utility networks.", "x": []}, {"w": 2, "q": "In a non-beacon-enabled IEEE 802.15.4 network, data frames are transmitted using:", "o": ["Slotted CSMA/CA", "Unslotted CSMA/CA", "Token passing", "Pure TDMA only"], "a": 1, "why": "Non-beacon-enabled IEEE 802.15.4 networks transmit data frames using unslotted CSMA/CA. In contrast, beacon-enabled networks use slotted CSMA/CA with a superframe structure managed by the PAN coordinator.", "x": []}, {"w": 2, "q": "Which statement correctly describes the relationship between IEEE 802.15.4 and ZigBee?", "o": ["IEEE 802.15.4 provides layers 1 and 2, while ZigBee extends the functionality to layer 3 and above.", "ZigBee provides only the physical layer, while IEEE 802.15.4 provides all higher layers.", "Both standards operate only at the application layer.", "ZigBee and IEEE 802.15.4 are identical standards with no functional distinction."], "a": 0, "why": "IEEE 802.15.4 primarily specifies the physical and MAC layers. ZigBee operates on top of these layers and adds higher-layer functions, including authentication, encryption, routing, forwarding, and support for mesh networking.", "x": []}, {"w": 2, "q": "Which of the following statements characterizes a ZigBee end device?", "o": ["It communicates with its parent node.", "It cannot relay data for other devices.", "It is a reduced-functionality device.", "It forms the network root and acts as the trust center."], "a": [0, 1, 2], "why": "A ZigBee end device has sufficient functionality to communicate with its parent, but it cannot relay data for other devices. It is therefore a reduced-functionality device. The coordinator, not an end device, forms the network root and may act as the trust center.", "x": []}, {"w": 2, "q": "Which option correctly describes addressing in 6LoWPAN?", "o": ["A 16-bit address is globally unique, while a 64-bit address is PAN-specific.", "A 16-bit short address is PAN-specific and assigned by the PAN coordinator, while a 64-bit extended address is globally unique.", "Both 16-bit and 64-bit addresses are globally unique and assigned by an Internet router.", "Both address types are used only for multicast communication."], "a": 1, "why": "6LoWPAN supports 16-bit short addresses for PAN-specific communication; these are assigned by the PAN coordinator. It also supports 64-bit extended addresses, which are globally unique.", "x": []}, {"w": 2, "q": "State True or False. In LOADng routing, an intermediate router may respond to a Route Request (RREQ) whenever it already has an active route to the requested destination.", "o": ["True", "False"], "a": 1, "why": "In LOADng, only the destination is permitted to respond to an RREQ. Intermediate LOADng routers are explicitly prohibited from responding, even when they have an active route to the requested destination.", "x": []}, {"w": 2, "q": "How does a passive RFID tag obtain the power required to transmit information?", "o": ["It uses its own internal battery.", "It is powered inductively by an RFID reader.", "It receives power through a wired AIDC connection.", "It does not require any source of power."], "a": 1, "why": "Passive RFID tags do not have their own power supply. They must first be powered inductively by an RFID reader before they can transmit information. Active RFID tags, in contrast, have their own power supply.", "x": []}, {"w": 3, "q": "State whether the following statement is true or false. Statement: There is no network layer in Wired HART", "o": ["True", "False"], "a": 0, "why": "There is no network layer in Wired HART.", "x": []}, {"w": 3, "q": "Zwave operates at ___ MHz in the US and ___ MHz in Europe.", "o": ["1008,989", "908.42, 868.42", "767.56,855.28", "None of these"], "a": 1, "why": "Zwave operates at 908.42 MHz in the US and 868.42 MHz in Europe.", "x": []}, {"w": 3, "q": "Dumb behavior of sensor nodes is ___ in nature (as it is dependent on the effects of the environmental conditions).", "o": ["Temporal", "Spatial", "Both (a) and (b)", "None of these"], "a": 0, "why": "Dumb behavior of sensor nodes is Temporal in nature (as it is dependent on the effects of the environmental conditions).", "x": []}, {"w": 3, "q": "The process of identifying channels consistently affected by interference and removing them from use is known as ___.", "o": ["Channel Trimming", "Channel Flushing", "Both (a) and (b)", "None of these"], "a": 3, "why": "Channel Blacklisting identifies channels consistently affected by interference and removes them from use.", "x": []}, {"w": 3, "q": "The full form of NFC is", "o": ["Near Field Contact", "Near Field Communication", "Both (a) and (b)", "Neither (a) nor (b)"], "a": 1, "why": "The full form of NFC is Near Field Communication.", "x": []}, {"w": 3, "q": "State true or false. NFC works on the principle of magnetic induction.", "o": ["True", "False"], "a": 0, "why": "NFC works on the principle of magnetic induction.", "x": []}, {"w": 3, "q": "State whether the following statement is true or false. Statement: NFC tags found in supermarket products are examples of active NFC.", "o": ["True", "False"], "a": 1, "why": "Passive NFC tags found in supermarket products are examples of passive NFC.", "x": []}, {"w": 3, "q": "Bluetooth is based on ___.", "o": ["Nanonets", "Binarynets", "Both (a) and (b)", "None of these"], "a": 3, "why": "Bluetooth is based on Piconets.", "x": []}, {"w": 3, "q": "A ___ in NFC emits a small electric current which creates a magnetic field that in turn bridges the physical space between the devices.", "o": ["reader", "writer", "destroyer", "None of these"], "a": 0, "why": "A reader in NFC emits a small electric current which creates a magnetic field that in turn bridges the physical space between the devices", "x": []}, {"w": 3, "q": "State true of false. Bluetooth technology is based on Ad-hoc network technology.", "o": ["False", "True"], "a": 1, "why": "Bluetooth technology is based on Ad-hoc network technology.", "x": []}, {"w": 3, "q": "State true or false. Zwave utilizes GFSK modulation and Hongkong channel encoding.", "o": ["True", "False"], "a": 1, "why": "Zwave utilizes GFSK modulation and Manchester channel encoding.", "x": []}, {"w": 3, "q": "The process of bypassing radio dead-spots is done using a message called ___ in Zwave.", "o": ["Ping", "Healing", "Frame", "None of these"], "a": 1, "why": "The process of bypassing radio dead-spots is done using a message called Healing in Zwave.", "x": []}, {"w": 3, "q": "State whether the following statement is true or false. Statement: Sensor nodes have unlimited battery life.", "o": ["True", "False"], "a": 1, "why": "Sensors nodes have limited battery life.", "x": []}, {"w": 3, "q": "State whether the following statement is true or false. Statement: The Link Manager Protocol in Bluetooth manages the establishment, authentication, link configuration.", "o": ["True", "False"], "a": 0, "why": "The Link Manager Protocol in Bluetooth manages the establishment, authentication, link configuration.", "x": []}, {"w": 3, "q": "Zigbee commonly uses ___data rate.", "o": ["250 kbps", "250 Mbps", "260 kbps", "260 Mbps"], "a": 0, "why": "Zigbee commonly uses 250 kbps data rate.", "x": []}, {"w": 4, "q": "What does the ultrasonic sensor measure generally in the AID system?", "o": ["Humidity", "Distance of the object", "Soil pH", "Light intensity"], "a": 1, "why": "In the Agricultural Intrusion Detection system, the ultrasonic sensor measures the distance at which the detected object is located.", "x": []}, {"w": 4, "q": "Which component processes the data received from the sensors in the AID system?", "o": ["Camera", "NFC tag", "Microcontroller", "Ultrasonic sensor"], "a": 2, "why": "The microcontroller processes the data received from the sensors in the AID system.", "x": []}, {"w": 4, "q": "(MSQ): How can standard nanodevices communicate?", "o": ["Electromagnetic communication", "Molecular communication", "Wired Ethernet", "ZigBee communication"], "a": [0, 1], "why": "The lecture discusses electromagnetic and molecular communication for nanodevices.", "x": []}, {"w": 4, "q": "When does sensing coverage guarantee network connectivity?", "o": ["When the transmission range is at least twice the sensing range", "When the sensing range is at least twice the transmission range", "When the transmission and sensing ranges are equal", "When the transmission range is smaller than the sensing range"], "a": 0, "why": "Sensing coverage guarantees connectivity when the transmission range is at least twice the sensing range.", "x": []}, {"w": 4, "q": "Which of the following is a coverage problem in a static WSN?", "o": ["Area coverage", "Data compression", "Route encryption", "Clock synchronization"], "a": 0, "why": "Area coverage is a standard coverage problem in a static wireless sensor network. The other options are networking tasks, not coverage categories.", "x": []}, {"w": 4, "q": "Which reporting method is used for forest-fire monitoring in a WSN?", "o": ["Event-driven reporting", "On-demand reporting", "Manual reporting", "Location-based reporting"], "a": 0, "why": "Forest-fire monitoring uses event-driven reporting because sensor nodes report data when a fire-related event is detected. The lecture contrasts this with on-demand reporting, such as an inventory-control system.", "x": []}, {"w": 4, "q": "What does a data mule do?", "o": ["Replaces all sensor nodes", "Measures only temperature", "Collects data and carries it to the sink", "Repairs damaged hardware"], "a": 2, "why": "A data mule visits sensor nodes, collects their data, and delivers it to the sink.", "x": []}, {"w": 4, "q": "What may happen if a critical stationary sensor node fails?", "o": ["The network may be partitioned", "All nodes become mobile", "The sensing range doubles", "The network repairs itself by movement"], "a": 0, "why": "Failure of a critical stationary node may divide the network into disconnected parts.", "x": []}, {"w": 4, "q": "A person who provides sensing information acts as a:", "o": ["Router", "Radio channel", "Actuator", "Data source"], "a": 3, "why": "In human-centric sensing, a person may act as a data source by providing or collecting information.", "x": []}, {"w": 4, "q": "Which is an advantage of a stationary wireless sensor network?", "o": ["Easy topology maintenance", "Automatic movement after node failure", "Continuously changing topology", "Unpredictable sensor locations"], "a": 0, "why": "In a stationary wireless sensor network, sensor nodes remain fixed. Therefore, deployment and topology maintenance are comparatively easier.", "x": []}, {"w": 4, "q": "State whether the following statement is True or False. Statement: In a UAV network, the network topology may change frequently because the UAVs are mobile.", "o": ["True", "False"], "a": 0, "why": "UAVs move from one location to another, causing frequent changes in their relative positions and communication links. Therefore, the network topology may change frequently.", "x": []}, {"w": 4, "q": "Which is a common issue in UAV networks?", "o": ["Frequent topology changes", "Fixed relative positions", "Permanent communication links", "No possibility of UAV failure"], "a": 0, "why": "UAV movement causes frequent changes in network topology and communication links.", "x": []}, {"w": 4, "q": "Compared with traditional SCADA, M2M supports:", "o": ["Only isolated systems", "No device communication", "Continuous human control", "Cross-platform integration"], "a": 3, "why": "Traditional SCADA commonly uses isolated proprietary systems, while M2M supports cross-platform integration.", "x": []}, {"w": 4, "q": "State whether the following statement is True or False. Statement: In a stationary wireless sensor network, sensor nodes can automatically move to restore connectivity after a node failure.", "o": ["True", "False"], "a": 1, "why": "In a stationary wireless sensor network, sensor nodes remain fixed. Therefore, they cannot move automatically to repair connectivity after a node failure.", "x": []}, {"w": 4, "q": "Which statement best describes M2M communication?", "o": ["Devices can exchange data without direct human control", "Every data exchange must be performed manually", "Only one device can communicate at a time", "Devices cannot communicate through a network"], "a": 0, "why": "M2M communication allows machines or devices to exchange data automatically. Human intervention may still be required for maintenance and operational stability.", "x": []}, {"w": 5, "q": "What does interoperability allow IoT devices to do?", "o": ["Communicate and exchange data", "Work only offline", "Use only one protocol", "Disable other devices"], "a": 0, "why": "Interoperability enables different IoT devices and systems to communicate and exchange data.", "x": []}, {"w": 5, "q": "Syntactic interoperability deals with:", "o": ["Message format", "Battery size", "Device colour", "Sensor weight"], "a": 0, "why": "Syntactic interoperability concerns the format of messages exchanged between devices and users.", "x": []}, {"w": 5, "q": "What does UMB stand for?", "o": ["Universal Middleware Bridge", "Unified Mobile Board", "Universal Memory Block", "User Management Bridge"], "a": 0, "why": "UMB stands for Universal Middleware Bridge. It helps different middleware-based devices work together.", "x": []}, {"w": 5, "q": "What is the operating voltage of the Arduino UNO?", "o": ["3.3 V", "5 V", "9 V", "12 V"], "a": 1, "why": "The Arduino UNO operates at 5 volts.", "x": []}, {"w": 5, "q": "What is a program written in the Arduino IDE called?", "o": ["Packet", "Sketch", "Frame", "Query"], "a": 1, "why": "A program created and uploaded using the Arduino IDE is called a sketch.", "x": []}, {"w": 5, "q": "Which interface is mainly used to connect an Arduino UNO to a computer?", "o": ["HDMI", "USB", "VGA", "Ethernet"], "a": 1, "why": "The Arduino UNO uses a USB interface to connect to a computer. The USB connection can be used to upload programs to the board and also provide power during development.", "x": []}, {"w": 5, "q": "What is the conventional starting index of an array in Arduino programming?", "o": ["-1", "0", "1", "2"], "a": 1, "why": "As in C and C++, Arduino arrays use zero-based indexing. Therefore, the first element is stored at index 0.", "x": []}, {"w": 5, "q": "Which Arduino function is used to generate a pseudo-random number within a specified range?", "o": ["random()", "pinMode()", "digitalWrite()", "attachInterrupt()"], "a": 0, "why": "The random() function generates a pseudo-random number in a specified range. For example, random(max) produces a value within the range defined by max.", "x": []}, {"w": 5, "q": "In the traffic-control example, which LED is switched ON first to represent the GO signal?", "o": ["Red LED", "Yellow LED", "Green LED", "All three LEDs simultaneously"], "a": 2, "why": "The traffic() function first sets the green LED HIGH and displays the GO message. After a delay, it switches to yellow and then red.", "x": []}, {"w": 5, "q": "Which quantities are measured by a DHT sensor?", "o": ["Temperature and humidity", "Distance and speed", "Light and sound", "Pressure and altitude"], "a": 0, "why": "A DHT sensor measures the temperature and humidity of its surroundings.", "x": []}, {"w": 5, "q": "What does a sensor convert a physical quantity into?", "o": ["A software program", "Mechanical motion", "A network address", "An electrical signal"], "a": 3, "why": "A sensor is an electronic element that converts a physical quantity or measurement into an electrical signal.", "x": []}, {"w": 5, "q": "In the DHT sensor sketch, delay(2000) causes successive readings to be printed after approximately how much time?", "o": ["0.2 seconds", "1 second", "2 seconds", "20 seconds"], "a": 2, "why": "The delay() function takes time in milliseconds. n is used to add data to the end of an existing file without erasing its existing content?", "o": ["r (read mode)", "w (write mode)", "a (append mode)", "r+ (read and write mode)"], "a": 2, "why": "Python supports four basic file modes: r (read), w (write), a (append), and r+ (read and write). The append mode adds new data to the end of the file without deleting existing content.", "x": []}, {"w": 6, "q": "Which Python library, installable via pip, is used for image read/write operations as covered in the lecture?", "o": ["NumPy", "PIL / Pillow", "OpenCV", "Matplotlib"], "a": 1, "why": "PIL (Python Image Library) is used to work with image files. It is installed using 'sudo pip install pillow'; PIL supports up to Python 2.7 while Pillow supports Python 3.x.", "x": []}, {"w": 6, "q": "Which socket_type value is used while creating a TCP/IP socket in Python's socket module?", "o": ["SOCK_DGRAM", "SOCK_STREAM", "SOCK_RAW", "SOCK_SEQPACKET"], "a": 1, "why": "A socket is created using socket.socket(socket_family, socket_type, protocol). For a TCP/IP (connection-oriented) socket, socket_family is AF_INET and socket_type is SOCK_STREAM.", "x": []}, {"w": 6, "q": "How many GPIO pins does the Raspberry Pi 3 Model B have, as shown in the specifications table?", "o": ["26", "32", "40", "44"], "a": 2, "why": "As per the specifications table, the Raspberry Pi 3 Model B, Raspberry Pi 2 Model B, and Raspberry Pi Zero all have 40 GPIO pins.", "x": []}, {"w": 6, "q": "Which of the following is an officially supported operating system for Raspberry Pi mentioned in the lecture?", "o": ["Raspbian", "Windows XP", "macOS", "Solaris"], "a": 0, "why": "Raspbian and NOOBS are the officially supported operating systems for Raspberry Pi. Ubuntu Mate, Snappy Ubuntu Core, Windows 10 Core, Pinet, and RISC OS are examples of third-party operating systems.", "x": []}, {"w": 6, "q": "Raspberry Pi is best described as a:", "o": ["Printer", "Smartphone", "Wi-Fi router", "Single-board computer"], "a": 3, "why": "The lecture introduces Raspberry Pi as a computer that fits in your palm — a low-cost, single-board computer that is easy to access and use.", "x": []}, {"w": 6, "q": "Which command is used to install the GPIO library on Raspberry Pi before programming the blinking LED example?", "o": ["sudo apt-get install python-rpi.gpio", "pip install gpio", "sudo apt-get install led-lib", "npm install rpi-gpio"], "a": 0, "why": "After installing Python development tools using 'sudo apt-get install python-dev', the GPIO library is installed using 'sudo apt-get install python-rpi.gpio'.", "x": []}, {"w": 6, "q": "Where is the CSI camera connector slot located on the Raspberry Pi board?", "o": ["Between the USB ports", "Between the Ethernet port and the HDMI port", "Next to the power supply pin", "On the underside of the board"], "a": 1, "why": "The Raspberry Pi Camera connects through a dedicated CSI slot, which is placed between the Ethernet port and the HDMI port on the board.", "x": []}, {"w": 6, "q": "Which terminal command captures a still image using the Raspberry Pi camera?", "o": ["raspistill -o image.jpg", "raspicam capture", "pi-camera snap", "capture.py --img"], "a": 0, "why": "Running 'raspistill -o image.jpg' in the terminal captures an image using the Raspberry Pi camera and stores it as image.jpg.", "x": []}, {"w": 6, "q": "What does DHT stand for in the DHT sensor used with Raspberry Pi in the auto-cooling system?", "o": ["Digital Heat Transfer", "Digital Humidity and Temperature", "Direct Hardware Trigger", "Dual Humidity Thermostat"], "a": 1, "why": "DHT stands for Digital Humidity and Temperature Sensor. It has 4 pins: PIN 1 (3.3V–5V power supply), PIN 2 (Data), PIN 3 (Null), and PIN 4 (Ground).", "x": []}, {"w": 6, "q": "How many output terminals does the relay used in the temperature-dependent auto-cooling system have, as shown in the lecture?", "o": ["2", "3", "4", "5"], "a": 1, "why": "The relay is a mechanical/electromechanical switch with 3 output terminals (left to right): NO (normal open), Common, and NC (normal close).", "x": []}, {"w": 6, "q": "State whether the following statement is True or False. Statement: In the temperature-dependent auto-cooling system, the fan operates when the surrounding temperature rises above the threshold value specified in the code.", "o": ["True", "False"], "a": 0, "why": "The lecture demonstrates that the fan is switched on whenever the measured temperature exceeds the threshold value set in the program.", "x": []}, {"w": 7, "q": "In the remote data logging system, which socket type is used to send sensor data from the client to the server?", "o": ["SOCK_STREAM", "SOCK_DGRAM", "SOCK_RAW", "SOCK_SEQPACKET"], "a": 1, "why": "The client creates a UDP socket using socket.socket(socket.AF_INET, socket.SOCK_DGRAM) to send the sensor readings to the server.", "x": []}, {"w": 7, "q": "Which Adafruit function is used in the client code to read humidity and temperature values from the DHT sensor?", "o": ["Adafruit_DHT.read_retry()", "Adafruit_DHT.get_data()", "Adafruit_DHT.sense()", "Adafruit_DHT.capture()"], "a": 0, "why": "The sensordata() function calls Adafruit_DHT.read_retry(sensor,17), which returns the humidity and temperature values from the DHT sensor.", "x": []}, {"w": 7, "q": "Where does the server in the remote data logging example save the data received from the client as mentioned in the lecture?", "o": ["In a MySQL database", "In a text file named Datalog.txt", "On a cloud dashboard", "In an Excel spreadsheet"], "a": 1, "why": "The server code opens 'Datalog.txt' in append mode and writes the received message from the client into this text file.", "x": []}, {"w": 7, "q": "Which Python string function is used to split the comma-separated sensor data into separate values on the server?", "o": ["split()", "divide()", "partition()", "separate()"], "a": 0, "why": "The split() function splits a string into multiple strings based on a specified separator/delimiter, e.g. Data.split(\",\") splits data wherever a comma is found.", "x": []}, {"w": 7, "q": "State whether the following statement is True or False. Statement: Matplotlib Python library is used to plot the temperature and humidity data received at the server in the lecture.", "o": ["False", "True"], "a": 1, "why": "MATPLOTLIB is a Python library used to create 2D plots; functions such as plot(), xlabel(), ylabel(), and title() are used to plot and label the sensor data.", "x": []}, {"w": 7, "q": "Which matplotlib function turns on interactive mode so that the plot updates in real time as new data arrives?", "o": ["ion()", "grid()", "subplot()", "figure()"], "a": 0, "why": "ion() turns on the interactive mode in matplotlib. Other common plotting functions mentioned include figure(), grid(), subplot(), close(), and scatter().", "x": []}, {"w": 7, "q": "In a traditional (non-SDN) network, where does the routing protocol logic (e.g., OSPF) mainly execute?", "o": ["In a centralized controller", "At the individual switches", "On the end-user device", "In the cloud"], "a": 1, "why": "In the current network, protocols like OSPF execute at the switches, which forward traffic in a distributed manner with no centralized control.", "x": []}, {"w": 7, "q": "In which year was the OpenFlow project — from which the idea of software-defined networking originated — presented at ACM SIGCOMM?", "o": ["2006", "2008", "2009", "2011"], "a": 1, "why": "The idea of software-defined networking originated from the OpenFlow project, presented at ACM SIGCOMM in 2008. Stanford published the OpenFlow V1.0.0 specification the following year.", "x": []}, {"w": 7, "q": "What message does a switch send to the SDN controller when it receives a packet for which no matching flow-rule exists?", "o": ["PACKET-IN message", "FLOW-REQUEST message", "RULE-MISS alert", "CONTROL-SYNC message"], "a": 0, "why": "When no flow-rule is present for an incoming request, the switch sends a PACKET-IN message to the controller, which then decides a suitable flow-rule and inserts it at the switch.", "x": []}, {"w": 7, "q": "Which SDN API is used for communication between the control layer and the infrastructure layer?", "o": ["Northbound API", "Southbound API", "East-Westbound API", "North-Southbound API"], "a": 1, "why": "The Southbound API is used to communicate between the control layer and the infrastructure layer using the OpenFlow protocol. The Northbound API communicates between the control and application layers.", "x": []}, {"w": 7, "q": "According to the lecture, approximately how many requests per second can a typical SDN controller handle through a single thread?", "o": ["50", "100", "200", "500"], "a": 2, "why": "The lecture states that a controller can typically handle around 200 requests in a second through a single thread.", "x": []}, {"w": 7, "q": "Which control mechanism is described where the entire network's control decisions are taken by a single controller?", "o": ["Distributed control", "Centralized control", "Hierarchical control", "Federated control"], "a": 1, "why": "In centralized control, control decisions are taken in a centralized manner by a single controller, unlike distributed control where each subnetwork is controlled by a different controller.", "x": []}, {"w": 7, "q": "Which of the following is listed as a benefit of integrating SDN with IoT?", "o": ["Increased hardware cost", "Visibility of network resources", "Reduced sensor accuracy", "Elimination of all controllers"], "a": 1, "why": "Benefits of integrating SDN in IoT include intelligent routing decisions, simplified information collection/analysis/decision-making, visibility of network resources, and intelligent traffic pattern analysis.", "x": []}, {"w": 7, "q": "According to the lecture, what is a key resource-constraint challenge in wireless sensor networks that motivates software-defined WSN?", "o": ["Excess bandwidth", "Limited memory for control programs", "Too many controllers", "Unlimited computation power"], "a": 1, "why": "Wireless sensor network challenges include real-time programming of sensor nodes, vendor-specific architecture, resource-constrained (heavy computation cannot be performed) devices, and limited memory, meaning too many control programs cannot be inserted.", "x": []}, {"w": 7, "q": "In the SDN-WISE protocol stack for sensor nodes, what does \"INPP\" stand for?", "o": ["Integrated Node Path Protocol", "Internal Node Power Processing", "In Network Packet Processing", "IoT Network Priority Protocol"], "a": 2, "why": "In the SDN-WISE protocol stack, the forwarding layer above IEEE 802.15.4 consists of flow-rules, and INPP stands for In Network Packet Processing.", "x": []}, {"w": 8, "q": "Which of the following is listed as a problem in traditional (non-SDN) mobile networks?", "o": ["Too flexible hardware architecture", "Excess centralized control", "Very low operational cost", "Difficult to scale due to static, over-provisioned networks"], "a": 3, "why": "Traditional mobile networks are difficult to scale because static, over-provisioned networks are inflexible to manage high-demand mobile traffic; they are also difficult to manage, inflexible, and cost-expensive.", "x": []}, {"w": 8, "q": "In the ODIN architecture for software-defined wireless networks, what does the 'Odin agent' do?", "o": ["It is placed at the controller end to manage policies", "It replaces the OpenFlow protocol entirely", "It is placed with the physical devices to communicate with the controller", "It performs billing for cloud resources"], "a": 2, "why": "In ODIN, an agent is placed at access points (with the physical devices) to communicate with the controller, while the Odin master resides at the controller end.", "x": []}, {"w": 8, "q": "What is the primary goal of Mobi-Flow's proactive rule placement approach in Software-Defined IoT?", "o": ["To place flow-rules randomly across all access points", "To predict users' future location and place flow-rules at APs accordingly", "To eliminate the need for a controller", "To increase the number of PACKET-IN messages"], "a": 1, "why": "Mobi-Flow predicts the location of end-users at time (t+1) while they are at time (t), and places flow-rules at the access points that can be associated with the users based on their predicted locations, using an order-K Markov predictor.", "x": []}, {"w": 8, "q": "Which simulation tool is mentioned in the lecture for experimenting with wireless software-defined networks, supporting both wired and wireless (IEEE 802.11) protocols?", "o": ["CloudSim", "NS2", "GreenCloud", "Mininet-WiFi"], "a": 3, "why": "Mininet-WiFi can be used to deploy a network supporting both wired (Ethernet) and wireless (WiFi, IEEE 802.11) protocols, while ONOS can be used to place the controllers.", "x": []}, {"w": 8, "q": "According to the NIST definition quoted in the lecture, cloud computing enables on-demand network access to a shared pool of what?", "o": ["Fixed, dedicated hardware resources", "Configurable computing resources", "Only storage resources", "Only networking resources"], "a": 1, "why": "NIST defines cloud computing as a model for enabling convenient, on-demand network access to a shared pool of configurable computing resources such as networks, servers, storage, and applications.", "x": []}, {"w": 8, "q": "Which of the following is one of the essential characteristics of cloud computing as defined by NIST?", "o": ["Rapid elasticity", "Manual resource allocation", "Single-tenant only access", "Fixed billing regardless of usage"], "a": 0, "why": "NIST lists rapid elasticity as an essential characteristic, meaning cloud resource allocation and release should be rapid, elastic, and automatic, giving consumers the impression of infinite resources.", "x": []}, {"w": 8, "q": "Which cloud deployment model is set up for the exclusive use of a single organization, typically managed on-premises or by a third party off-premises?", "o": ["Public cloud", "Private cloud", "Community cloud", "Multi-cloud"], "a": 1, "why": "A private cloud is a cloud set-up functioned only for a single organization, typically managed by the organization itself (on-premises) or by a third party (off-premises).", "x": []}, {"w": 8, "q": "Which of the following is given as an example of a public cloud provider in the lecture?", "o": ["Amazon Web Services (AWS)", "A company's internal private data center", "A single organization's dedicated server room", "A community-only cloud shared by hospitals"], "a": 0, "why": "Public cloud examples given include Amazon Web Services (AWS), Google Compute Engine, and Microsoft Azure — cloud set-ups available for the use of any person or industry.", "x": []}, {"w": 8, "q": "Which cloud service model provides on-demand delivery of computing infrastructure such as servers, storage, network, and operating system?", "o": ["SaaS", "PaaS", "IaaS", "DBaaS"], "a": 2, "why": "Infrastructure-as-a-Service (IaaS) contains the basic building blocks for cloud IT, providing access to networking features, computers (virtual or dedicated hardware), storage, and operating systems.", "x": []}, {"w": 8, "q": "In the IaaS working methodology, which component allows multiple virtual machines to share the same physical hardware?", "o": ["DNS server", "Load balancer", "Firewall", "Hypervisor"], "a": 3, "why": "In IaaS, the hypervisor sits above the physical hardware and manages multiple virtual machines (VMs), each running its own operating system, on a virtualized server.", "x": []}, {"w": 8, "q": "Which cloud service model is described as 'application middleware offered as a service to developers', removing the need to manage underlying hardware and operating systems?", "o": ["IaaS", "SaaS", "PaaS", "Community Cloud"], "a": 2, "why": "Platform-as-a-Service (PaaS) removes the need for organizations to manage underlying infrastructure (hardware and OS) and lets developers focus on deploying and managing their applications; it is described as application middleware offered as a service.", "x": []}, {"w": 8, "q": "What is the primary purpose of a Service Level Agreement (SLA) in cloud service management?", "o": ["To define the physical location of the data center", "To define the non-functional requirements expected from the service provider", "To specify the programming language used by the cloud provider", "To list the hardware vendors used by the provider"], "a": 1, "why": "An SLA defines the non-functional requirements expected from the service provider and provides a roadmap with clearly defined deliverables, describing the quality, utility, and warranty of services expected by the customer.", "x": []}, {"w": 8, "q": "In cloud service accounting and billing, what does 'service accounting' primarily aim to obtain?", "o": ["Resource usage information, typically in the form of records", "The physical address of end-users", "The source code of hosted applications", "The marketing budget of the provider"], "a": 0, "why": "Service accounting aims to obtain resource usage information, typically in the form of records, depending on infrastructure and service monitoring where usage information is obtained from metric measurements.", "x": []}, {"w": 8, "q": "What is the main purpose of using cloud simulators such as CloudSim before actual deployment?", "o": ["To permanently replace the need for real cloud infrastructure", "To physically manufacture cloud hardware", "To increase the billing cost of cloud services", "To provide a reliable, scalable, and repeatable environment for pre-deployment performance evaluation"], "a": 3, "why": "Simulation tools provide a reliable, scalable, and repeatable environment for performance evaluation, facilitating pre-deployment tests of services at no cost and enabling repeatable evaluation.", "x": []}, {"w": 8, "q": "CloudSim, a widely used cloud simulation framework, was developed at which institution and is based on which programming language?", "o": ["Stanford University, based on Python", "CLOUDS Lab, University of Melbourne, based on Java", "MIT, based on C++", "IIT Kharagpur, based on JavaScript"], "a": 1, "why": "CloudSim is a simulation framework that models cloud computing environments (data centers, VMs, applications, users, and network topology), written in a Java-based environment, and developed at the CLOUDS Lab of the University of Melbourne.", "x": []}, {"w": 9, "q": "OpenStack was launched in 2010 as a joint project between Rackspace Hosting and which other organization?", "o": ["Google", "Microsoft", "NASA", "IBM"], "a": 2, "why": "OpenStack started in 2010 as a joint project of Rackspace Hosting and NASA, and is now open-source cloud software.", "x": []}, {"w": 9, "q": "Which OpenStack component provides the dashboard (GUI) that gives an overview of the other components?", "o": ["Nova", "Keystone", "Horizon", "Swift"], "a": 2, "why": "Horizon is OpenStack's web dashboard. Nova is compute, Keystone is identity and Swift is object storage.", "x": []}, {"w": 9, "q": "Which OpenStack component is the compute service where instances are launched?", "o": ["Nova", "Glance", "Cinder", "Neutron"], "a": 0, "why": "Nova is the compute service that launches and manages instances. Glance stores images, Cinder gives block storage and Neutron handles networking.", "x": []}, {"w": 9, "q": "Which script/tool is used in the lecture to install OpenStack, requiring the local.conf file to be configured with passwords and host IP before running?", "o": ["stack.sh via Devstack", "docker-compose", "kubeadm", "ansible-playbook"], "a": 0, "why": "The lecture installs OpenStack with DevStack: you set passwords and the host IP in local.conf, then run stack.sh.", "x": []}, {"w": 9, "q": "According to the lecture, what does sensor-cloud fundamentally provide, beyond merely integrating sensors with cloud computing?", "o": ["A physical replacement for all sensor hardware", "Virtualization of sensor nodes, offered on a pay-per-use basis", "A way to eliminate the need for a sink node", "Free unlimited sensor deployment"], "a": 1, "why": "Sensor-cloud virtualizes physical sensor nodes and offers them to users as a service, paid per use.", "x": []}, {"w": 9, "q": "In a traditional Wireless Sensor Network (WSN), who is typically responsible for redeployment of the sensor nodes?", "o": ["The Sensor-Cloud Service Provider (SCSP)", "The end-user of the sensor-cloud", "The WSN-user", "A third-party auditor"], "a": 2, "why": "In a traditional WSN the user owns the network, so the WSN-user has to redeploy the nodes. In sensor-cloud this burden moves away from the end-user.", "x": []}, {"w": 9, "q": "In the sensor-cloud model, which actor purchases physical sensor devices and lends them to the sensor-cloud, playing a role from a business perspective?", "o": ["End-user", "Sensor-owner", "Sensor-Cloud Service Provider (SCSP)", "WSN-user"], "a": 1, "why": "Sensor-owners buy physical sensors and lend them to the sensor-cloud, earning from their use.", "x": []}, {"w": 9, "q": "Which of the following is listed as a major limitation of traditional WSNs that motivates the sensor-cloud model?", "o": ["Unlimited scalability at zero cost", "Difficulty adapting to a change of requirement (e.g., moving from agriculture to smart home use)", "Excessive availability of skilled vendors", "No need for maintenance"], "a": 1, "why": "A traditional WSN is built for one application, so changing its purpose (for example from agriculture to smart homes) is hard. Sensor-cloud lets the same sensors serve different needs.", "x": []}, {"w": 9, "q": "In the Optimal Composition of Virtual Sensors, what does CoV-I refer to?", "o": ["Composition of virtual sensors spanning multiple geographic regions", "Composition of virtual sensors using only homogeneous nodes within the same geographic region", "A pricing model for sensor-cloud", "A caching mechanism for sensor data"], "a": 1, "why": "CoV-I composes a virtual sensor from homogeneous (same-type) physical nodes within one geographic region.", "x": []}, {"w": 9, "q": "In the sensor-cloud caching mechanism, which cache handles requests directly from the end-user and decides whether to serve data directly or re-cache from another source?", "o": ["External Cache (EC)", "Sensor Cache (SC)", "Distributed Cache (DC)", "Internal Cache (IC)"], "a": 3, "why": "The Internal Cache (IC) takes end-user requests and decides whether to serve stored data or refresh it from the external cache.", "x": []}, {"w": 9, "q": "Why is dynamic and adaptive data caching useful in sensor-cloud, according to the lecture?", "o": ["Because environmental conditions always change extremely fast", "Because it removes the need for a sensor-owner", "Because caching eliminates the need for virtualization", "Because unnecessary sensing during slow environmental change wastes energy"], "a": 3, "why": "When conditions change slowly, sensing again and again gives the same data and wastes energy, so serving cached data saves power.", "x": []}, {"w": 9, "q": "Which company is credited with coining the term 'fog computing'?", "o": ["Google", "Amazon", "CISCO", "IBM"], "a": 2, "why": "Cisco introduced the term fog computing.", "x": []}, {"w": 9, "q": "Which of the following is listed as a key issue with the traditional cloud model that motivates fog computing?", "o": ["Excess bandwidth availability", "Volume, latency, and bandwidth limitations of the cloud", "Too much local processing power at the device level", "Absence of any IoT devices"], "a": 1, "why": "Sending huge volumes of IoT data to a distant cloud causes latency and bandwidth problems; fog computing processes data closer to the devices.", "x": []}, {"w": 9, "q": "Where is the fog layer positioned in the fog computing architecture?", "o": ["Above the cloud layer", "Between the cloud and the IoT devices", "Inside each IoT device only", "There is no fixed position; it replaces the cloud entirely"], "a": 1, "why": "The fog layer sits between the cloud <script>
(function () {
  if (window.__polQuizStarted) return;
  window.__polQuizStarted = true;
  const WEEK_LABEL = w => "Week " + w;
  const LETTERS = ["A", "B", "C", "D", "E", "F"];
  const app = document.getElementById("app");

  // ---------- Browser storage (all optional; the quiz works without it) ----------
  function readJSON(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function writeJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function removeKey(key) { try { localStorage.removeItem(key); } catch (e) {} }
  // Everything below is kept separately for each subject: "mp:<subject>:<name>"
  let subject = null;
  let QUESTIONS = [], WEEKS = [];
  const storeId = sj => sj.store || sj.id;
  const K = name => "mp:" + storeId(subject) + ":" + name;
  const store = { get: () => readJSON(K("quiz"), null), set: v => writeJSON(K("quiz"), v), clear: () => removeKey(K("quiz")) };

  // Per-question stats { [id]: {c: correct, w: wrong} }, attempt history, bookmarks
  let stats = {}, history = [], bookmarks = new Set();
  const saveStats = () => writeJSON(K("stats"), stats);
  const saveHistory = () => writeJSON(K("history"), history);
  const saveBookmarks = () => writeJSON(K("bookmarks"), [...bookmarks]);

  // Psychology of Learning used these keys before the site had several subjects
  (function migrateOldKeys() {
    const map = { "pol-quiz-v1": "quiz", "pol-stats": "stats", "pol-history": "history", "pol-bookmarks": "bookmarks" };
    Object.keys(map).forEach(old => {
      const nk = "mp:psychology_of_learning:" + map[old];
      try { if (localStorage.getItem(old) != null && localStorage.getItem(nk) == null) localStorage.setItem(nk, localStorage.getItem(old)); localStorage.removeItem(old); } catch (e) {}
    });
  })();

  // ---------- Theme toggle: black (dark) by default ----------
  const themeBtn = document.getElementById("themeBtn");
  const root = document.documentElement;
  const isLight = () => root.getAttribute("data-theme") === "light";
  function setTheme(t) {
    root.setAttribute("data-theme", t);
    themeBtn.textContent = t === "light" ? "Dark mode" : "Light mode";
    try { localStorage.setItem("mp-theme", t); } catch (e) {}
  }
  themeBtn.onclick = () => setTheme(isLight() ? "dark" : "light");
  let savedTheme = "dark";
  try { savedTheme = localStorage.getItem("mp-theme") || localStorage.getItem("pol-theme") || "dark"; } catch (e) {}
  setTheme(savedTheme === "light" ? "light" : "dark");

  // ---------- Instant answer switch ----------
  const instantBtn = document.getElementById("instantBtn");
  let instant = readJSON("mp-instant", false) === true;
  function setInstant(on) {
    instant = on;
    instantBtn.setAttribute("aria-checked", String(on));
    instantBtn.title = on ? "Instant answer is on: the answer and explanation show as soon as you tap an option" : "Instant answer is off: answers are shown at the end";
    writeJSON("mp-instant", on);
  }
  instantBtn.onclick = () => {
    setInstant(!instant);
    if (run && !run.done && app.querySelector(".opts")) renderQuestion();
  };
  setInstant(instant);

  const perWeek = w => QUESTIONS.filter(q => q.w === w).length;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = ms => { const t = Math.round((ms || 0) / 1000); const m = Math.floor(t / 60), s = t % 60; return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); };
  const BM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

  function weakIds() {
    return QUESTIONS.map((q, id) => id).filter(id => {
      const s = stats[id]; if (!s || !s.w) return false;
      return s.c / (s.c + s.w) < 0.6;
    });
  }

  // ---------- State ----------
  let settings = { weeks: [], count: "all", shuffleQ: true, shuffleO: true };
  let run = null; // { items:[{id, order}], answers:[displayIdx|null], locked:[bool], i, done, elapsed, label }

  function buildRun(ids, opts) {
    opts = opts || {};
    let list = ids.slice();
    if (settings.shuffleQ) list = shuffle(list);
    const count = opts.all ? "all" : settings.count;
    if (count !== "all") list = list.slice(0, Number(count));
    const items = list.map(id => {
      const n = QUESTIONS[id].o.length;
      const base = [...Array(n).keys()];
      const isTF = n === 2 && /^true$/i.test(QUESTIONS[id].o[0]);
      return { id, order: settings.shuffleO && !isTF ? shuffle(base) : base };
    });

    save();
  }
  function save() { store.set({ settings, run }); }

  // ---------- Timer (counts only while a question is on screen) ----------

    const now = Date.now();
    const dt = now - lastTick; lastTick = now;

    if (el) el.textContent = fmtTime(run.elapsed);

  // ---------- Start screen ----------
  function renderStart() {
    const saved = store.get();
    const canResume = saved && saved.run && !saved.run.done && saved.run.items && saved.run.items.length;

    const best = history.length ? Math.max(...history.map(h => h.score)) : 0;
    const weak = weakIds();
    const bms = [...bookmarks].filter(id => QUESTIONS[id]);

    app.innerHTML = `
      <section class="hero">
        <button class="linkish back" id="backHome" type="button">← All subjects</button>

        <div class="stats">
          <span><b>${QUESTIONS.length}</b> questions</span>
          <span><b>${WEEKS.length}</b> weeks</span>
          <span><b>${QUESTIONS.filter(q => q.o.length === 2).length}</b> true/false</span>
        </div>
      </section>
      ${canResume ? `
      <div class="resume">
        <p><b>You have a quiz in progress.</b> ${answeredSaved} of ${saved.run.items.length} answered.</p>
        <div class="actions">
