<style>
/* Black (default) and light themes with a blue accent. Layout: one centred exam column (max 720px); a quiet header strip, one question card at a time, score sheet at the end. */
:root {
  --bg: #000000;
  --surface: #111318;
  --ink: #eef1f7;
  --muted: #9aa3b5;
  --line: #262b36;
  --accent: #5585ef;
  --accent-ink: #ffffff;
  --accent-soft: #16223d;
  --mark: #5585ef;
  --mark-soft: #121c33;
  --good: #4ade80;
  --good-soft: #0f2a1a;
  --bad: #ff5c5c;
  --bad-soft: #3a1414;
  --f-display: "Roboto", "Segoe UI", Arial, system-ui, sans-serif;
  --f-body: "Open Sans", "Segoe UI", Arial, system-ui, sans-serif;
  --f-mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
/* Light mode (blue on cool white), switched on with the header button */
:root[data-theme="light"] {
  --bg: #f2f5fb; --surface: #ffffff; --ink: #141a26; --muted: #5d6678; --line: #d8deea;
  --accent: #5585ef; --accent-ink: #ffffff; --accent-soft: #e2eafc;
  --mark: #5585ef; --mark-soft: #edf2fe;
  --good: #1d7a3e; --good-soft: #dcf0e2; --bad: #c62828; --bad-soft: #fbe3e3;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; margin: 0; padding: 0 16px; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 20px; display: flex; flex-direction: column; gap: 22px; min-height: 100vh; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 3px solid var(--mark); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; background: none; border: 0; padding: 4px 6px 4px 0; border-radius: 8px; color: var(--ink); text-align: left; }
.brand:hover { color: var(--accent); }
.brand .dot-unused { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .8rem; font-family: var(--f-mono); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .88rem; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

/* start screen */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-size: clamp(1.9rem, 5.5vw, 2.8rem); font-weight: 700; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 58ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .9rem; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--f-mono); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 10px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.field-head h3 { font-size: 1.02rem; }
.linkish { background: none; border: 0; color: var(--accent); font-size: .85rem; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: .9rem; user-select: none; }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip small { font-family: var(--f-mono); font-size: .72rem; opacity: .75; }
.toggles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--bg); }
.toggle input { accent-color: var(--accent); width: 18px; height: 18px; margin: 2px 0 0; flex: none; }
.toggle b { display: block; font-size: .95rem; }
.toggle span { font-size: .84rem; color: var(--muted); }
.count-row { display: flex; flex-wrap: wrap; gap: 8px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 14px 22px; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.primary:hover { filter: brightness(1.07); }
.primary:disabled { opacity: .45; cursor: not-allowed; }
.secondary { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; font-weight: 700; }
.secondary:hover { border-color: var(--muted); }
.resume { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--mark-soft); border: 1px solid var(--mark); border-radius: var(--r); padding: 14px 16px; }
.resume p { margin: 0; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }

/* quiz */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-meta { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 20px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tag { font-family: var(--f-mono); font-size: .74rem; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.qnum { font-family: var(--f-display); font-weight: 700; font-size: 2.4rem; line-height: 1; color: var(--line); }
.qtext { font-family: var(--f-body); font-weight: 400; font-size: clamp(1.05rem, 2.6vw, 1.2rem); line-height: 1.5; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--accent); }
.opt .key { flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: .9rem; border: 1.5px solid var(--line); background: var(--surface); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-checked="true"] { border-color: var(--mark); background: var(--mark-soft); }
.opt[aria-checked="true"] .key { background: var(--mark); border-color: var(--mark); color: var(--accent-ink); }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.nav .right { display: flex; gap: 10px; margin-left: auto; }
.hint { font-size: .8rem; color: var(--muted); }
.confirm { background: var(--mark-soft); border: 1px solid var(--mark); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; }
.confirm .row { display: flex; gap: 10px; flex-wrap: wrap; }

/* results */
.score { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.ring { width: 150px; height: 150px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .val b { font-family: var(--f-display); font-size: 2.3rem; font-weight: 700; line-height: 1; display: block; }
.ring .val small { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.verdict h2 { font-size: clamp(1.5rem, 4.5vw, 2rem); }
.verdict p { margin: 6px 0 0; color: var(--muted); }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
.tile b { font-family: var(--f-mono); font-size: 1.5rem; display: block; font-variant-numeric: tabular-nums; }
.tile span { font-size: .82rem; color: var(--muted); }
.tile.good b { color: var(--good); } .tile.bad b { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font-weight: 700; color: var(--muted); margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.review { display: flex; flex-direction: column; gap: 12px; }
.ritem { border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 10px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.ritem.ok { border-left-color: var(--good); }
.ritem .rq { font-weight: 600; overflow-wrap: anywhere; }
.ritem .meta { display: flex; gap: 8px; align-items: center; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.ans { display: flex; gap: 8px; align-items: baseline; font-size: .93rem; overflow-wrap: anywhere; }
.ans .lbl { flex: none; font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; }
.ans.yours .lbl { background: var(--bad-soft); color: var(--bad); }
.ans.right .lbl { background: var(--good-soft); color: var(--good); }
.ans.skip .lbl { background: var(--mark-soft); color: var(--ink); }
.ropts { display: flex; flex-direction: column; gap: 6px; }
.ropt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-size: .93rem; }
.ropt .key { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: .8rem; border: 1.5px solid var(--line); background: var(--surface); }
.ropt .txt { flex: 1 1 12ch; min-width: 0; overflow-wrap: anywhere; }
.ropt .rtag { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.ropt.right { border-color: var(--good); background: var(--good-soft); }
.ropt.right .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.ropt.right .rtag { color: var(--good); }
.ropt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ropt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.ropt.wrong .rtag { color: var(--bad); }
.empty { text-align: center; padding: 24px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }

footer { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: .84rem; color: var(--muted); }
footer .credit b { font-family: var(--f-mono); color: var(--accent); font-weight: 700; }

@media (max-width: 520px) {
  .score { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .tally { grid-template-columns: 1fr 1fr 1fr; }
  .tile b { font-size: 1.25rem; }
  .qnum { font-size: 1.8rem; }
  .ropt .rtag { flex-basis: 100%; padding-left: 36px; margin-top: -4px; }
  .nav .right { width: 100%; }
  .nav .right .primary { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* header actions + instant-answer switch */
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.itoggle { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; background: transparent; color: var(--muted); font-size: .88rem; font-weight: 600; }
.itoggle .track { width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.itoggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.itoggle[aria-checked="true"] { color: var(--ink); border-color: var(--accent); }
.itoggle[aria-checked="true"] .track { background: var(--accent); }
.itoggle[aria-checked="true"] .track::after { transform: translateX(14px); background: #ffffff; }
.itoggle:hover { color: var(--ink); }

/* instant feedback on the question screen */
.opt:disabled { cursor: default; }
.opt:disabled:hover { border-color: var(--line); }
.opt.is-right, .opt.is-right:disabled:hover { border-color: var(--good); background: var(--good-soft); }
.opt.is-right .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.is-wrong, .opt.is-wrong:disabled:hover { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt .mark { margin-left: auto; font-family: var(--f-mono); font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; flex: none; }
.opt.is-right .mark { color: var(--good); } .opt.is-wrong .mark { color: var(--bad); }
.fb { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.fb.ok { border-color: var(--good); background: var(--good-soft); }
.fb .fb-title { font-family: var(--f-display); font-weight: 700; color: var(--bad); }
.fb.ok .fb-title { color: var(--good); }
.fb p { margin: 0; font-size: .95rem; overflow-wrap: anywhere; }
.fb .pill { display: inline-block; font-family: var(--f-mono); font-size: .75rem; padding: 2px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); margin-right: 6px; }
.qmeta { display: flex; gap: 8px; align-items: center; }
.bm { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); font-size: .8rem; }
.bm svg { width: 14px; height: 14px; }
.bm[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.bm[aria-pressed="true"] svg { fill: currentColor; }
.score-so-far { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }

/* why boxes in the report */
.why { display: flex; flex-direction: column; gap: 6px; font-size: .92rem; border-top: 1px dashed var(--line); padding-top: 10px; }
.why p { margin: 0; overflow-wrap: anywhere; }
.why .wl { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-right: 6px; }
.why .wl.g { color: var(--good); } .why .wl.r { color: var(--bad); }
.why details summary { cursor: pointer; color: var(--accent); font-size: .86rem; }
.why details ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }

/* start page: progress, revision, history */
.section-title { font-family: var(--f-display); font-size: 1.05rem; margin: 0; }
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.rev { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.revcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.revcard h4 { margin: 0; font-family: var(--f-display); font-size: .98rem; display: flex; justify-content: space-between; gap: 8px; }
.revcard h4 b { font-family: var(--f-mono); color: var(--accent); }
.revcard p { margin: 0; font-size: .84rem; color: var(--muted); }
.revcard button { align-self: flex-start; }
.hist { display: flex; flex-direction: column; gap: 6px; }
.hrow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: .88rem; }
.hrow .when { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.hrow b { font-family: var(--f-mono); }
.small-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.danger { color: var(--bad); }
@media (max-width: 520px) {
  .stat4 { grid-template-columns: 1fr 1fr; }
  .itoggle .lbl-long { display: none; }
}

/* brand with logo */
.brand .logo { width: 34px; height: 34px; border-radius: 50%; flex: none; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.brand-sub { font-family: var(--f-body); font-weight: 400; font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.back { align-self: flex-start; font-size: .88rem; }

/* subject picker */
.subjects { display: flex; flex-direction: column; gap: 12px; }
.subj { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); transition: border-color .12s, transform .12s; }
.subj:hover { border-color: var(--accent); }
.subj-badge { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: .95rem; }
.subj-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.subj-name { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; overflow-wrap: anywhere; }
.subj-meta { font-size: .84rem; color: var(--muted); }
.subj-prog { font-size: .82rem; color: var(--muted); font-family: var(--f-mono); }
.subj-prog b { color: var(--accent); font-weight: 700; }
.subj-go { flex: none; font-size: 1.3rem; color: var(--accent); }

/* multiple-answer questions */
.msq { display: inline-block; align-self: flex-start; font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.rq .msq { margin-left: 6px; vertical-align: middle; }
.opts.multi .opt .key { border-radius: 6px; }
#checkBtn { align-self: flex-start; }
</style>
</head>

<script>
const SUBJECTS = [{"id": "psychology_of_learning", "name": "Psychology of Learning", "institute": "IIT Kharagpur", "short": "PL", "questions": [{"w": 0, "q": "What is Psychology?", "o": ["Just a social media trend", "An art of living", "A subject about human body", "A study of cognitive processes & behavior"], "a": 3, "why": "Psychology is the scientific study of the mind and behaviour: how we think, feel, perceive and act.", "x": ["A trend is a passing fashion; psychology is an established science.", "This describes a philosophy of life, not a scientific discipline.", "The study of the body is biology or anatomy, not psychology.", null]}, {"w": 0, "q": "A broad field of study that explores a variety of questions about thoughts, feelings and actions is ___?", "o": ["Society", "Globalization", "Psychology", "Social Science"], "a": 2, "why": "Psychology is the broad field that studies thoughts, feelings and actions.", "x": ["Society is a group of people, not a field of study.", "Globalization is a worldwide economic and cultural process.", null, "Social science is a wider family of subjects; the field that focuses on thoughts, feelings and actions is psychology."]}, {"w": 0, "q": "Learning has been a central topic of research in ___.", "o": ["Chemistry", "Physics", "Mathematics", "Psychology"], "a": 3, "why": "How people and animals learn has been one of psychology's core research topics since the discipline began.", "x": ["Chemistry studies substances and reactions, not learning.", "Physics studies matter and energy.", "Mathematics studies number, quantity and structure.", null]}, {"w": 0, "q": "The word Psyche means ___?", "o": ["Body or physique", "Mind or soul", "Spirituality", "Hormones"], "a": 1, "why": "'Psyche' is a Greek word meaning mind, soul or spirit, which is where 'psychology' gets its name.", "x": ["Body or physique is 'soma', the opposite of psyche.", null, "Spirituality is related but is not the literal meaning of psyche.", "Hormones are chemical messengers in the body."]}, {"w": 0, "q": "The ___ of learning focuses on how people learn.", "o": ["psychology", "english", "chemistry", "none of the given"], "a": 0, "why": "The psychology of learning is the branch of psychology that studies how people learn.", "x": [null, "English is a language and literature subject.", "Chemistry studies substances, not how people learn.", "Psychology of learning is exactly this field, so 'none' is wrong."]}, {"w": 0, "q": "To help people to function effectively and fulfill their own unique potential” is the aim of___ ___?", "o": ["Humanistic psychology", "Evolutionary biology", "Computer science", "Microbiology"], "a": 0, "why": "Humanistic psychology (Maslow, Rogers) aims to help people function well and reach their full potential, called self-actualization.", "x": [null, "Evolutionary biology studies how species change over time.", "Computer science studies computation and software.", "Microbiology studies micro-organisms."]}, {"w": 0, "q": "Psychology is not an independent science, but dependent on other fields.", "o": ["True", "False"], "a": 1, "why": "False. Psychology is an independent science with its own methods and theories, even though it borrows ideas from biology, philosophy and other fields.", "x": ["Borrowing ideas from other fields does not make psychology dependent; it is a science in its own right.", null]}, {"w": 0, "q": "The study of changes in an individual’s behavior during his/her lifetime is called ___.", "o": ["Hormonal psychology", "Gender psychology", "Developmental Psychology", "Genetics or Heredity"], "a": 2, "why": "Developmental psychology studies how behaviour and abilities change across a person's whole lifespan.", "x": ["Hormonal psychology is not the standard name for lifespan change.", "Gender psychology studies sex and gender differences.", null, "Genetics and heredity are biological influences, not a field that studies lifetime change."]}, {"w": 0, "q": "The study of differences and similarities in the behavior of animals of different species is called - ___.", "o": ["Developmental psychology", "Cultural psychology", "Personality psychology", "Comparative Psychology"], "a": 3, "why": "Comparative psychology compares the behaviour of different animal species to find similarities and differences.", "x": ["Developmental psychology studies change over a lifetime.", "Cultural psychology compares human cultures, not animal species.", "Personality psychology studies individual differences in personality.", null]}, {"w": 0, "q": "Humans are incapable of learning.", "o": ["True", "False"], "a": 1, "why": "False. Learning is a basic human ability; we learn throughout our lives.", "x": ["Humans constantly learn from experience, so this is untrue.", null]}, {"w": 1, "q": "Learning is often seen as the contiguous causal effect of ___ on behavior.", "o": ["blood", "bone density", "trauma", "experience"], "a": 3, "why": "Learning is a relatively lasting change in behaviour that is caused by experience.", "x": ["Blood is a body fluid, not a cause of learning.", "Bone density is a physical trait.", "Trauma can change behaviour, but learning is defined by experience in general.", null]}, {"w": 1, "q": "In order to say that learning has occurred, a hidden change in behavior must occur.", "o": ["True", "False"], "a": 1, "why": "False. Learning does not need a hidden change; it is usually shown through an observable change in behaviour or behaviour potential.", "x": ["Learning is inferred from observable change, so a 'hidden' change is not required.", null]}, {"w": 1, "q": "Which of the following is not a mental construct?", "o": ["skeleton", "knowledge", "representations", "associations"], "a": 0, "why": "A skeleton is a physical body structure. Knowledge, representations and associations are mental constructs.", "x": [null, "Knowledge is a mental construct.", "Mental representations are mental constructs.", "Associations between ideas are mental constructs."]}, {"w": 1, "q": "Learning changes the ___ structure of the brain through the process of continuous interactions between the learner and the external environment.", "o": ["physical", "social", "biological", "none of the given"], "a": 0, "why": "Learning physically changes the brain, for example by forming and strengthening connections between neurons (neuroplasticity).", "x": [null, "Learning changes social behaviour, but the brain's structure is physical.", "Learning does involve biology, but the course stresses that it changes the brain's physical structure (new and stronger connections between neurons).", "Physical is correct, so 'none' is wrong."]}, {"w": 1, "q": "___ shapes the learning process.", "o": ["Only thoughts", "Only emotions", "Both thoughts and emotions", "Neither thoughts nor emotions"], "a": 2, "why": "Thoughts and emotions both shape learning. Emotions affect attention, motivation and memory.", "x": ["Emotions also shape learning, so not only thoughts.", "Thoughts also shape learning, so not only emotions.", null, "Both clearly influence learning."]}, {"w": 1, "q": "Watson's work included the famous Little Albert experiment in which he conditioned a small child to ___ a white rat.", "o": ["fear", "love", "hate", "play with"], "a": 0, "why": "In the Little Albert experiment, Watson paired a white rat with a loud noise so that the child learned to fear the rat.", "x": [null, "The child was conditioned to fear, not love, the rat.", "The response conditioned was fear, not hate.", "Albert played with the rat before conditioning; afterwards he feared it."]}, {"w": 1, "q": "Behaviorism dominated psychology for much of the early ___ century.", "o": ["20th", "19th", "18th", "17th"], "a": 0, "why": "Behaviorism (Watson, Skinner) dominated psychology from about the 1910s to the 1950s, in the early 20th century.", "x": [null, "In the 19th century psychology was just starting with introspection.", "There was no scientific behaviorism in the 18th century.", "There was no scientific behaviorism in the 17th century."]}, {"w": 1, "q": "The state of “conscious incompetence” may be valuable ___ of a learning experience.", "o": ["at the end", "in the middle", "2 years after the end", "at the start"], "a": 3, "why": "Conscious incompetence, knowing what you don't know, is useful at the start because it motivates you to learn.", "x": ["By the end you should be moving towards competence.", "It is most valuable at the beginning, when it drives effort.", "Two years later is long after the learning experience.", null]}, {"w": 1, "q": "Which of the following is not an outcome of effective e-learning?", "o": ["wider range of strategies", "more reflective approach", "more positive emotions towards learning", "more disconnected knowledge"], "a": 3, "why": "Effective e-learning leads to connected knowledge. More disconnected knowledge is not an outcome of it.", "x": ["Effective e-learning does give learners a wider range of strategies.", "Effective e-learning does encourage reflection.", "Effective e-learning does build more positive feelings about learning.", null]}, {"w": 1, "q": "Instrumental conditioning is an example of ___ learning.", "o": ["sensitization", "habituation", "associative", "meaningful"], "a": 2, "why": "Instrumental (operant) conditioning links a behaviour with its consequence, so it is associative learning.", "x": ["Sensitization is non-associative: a stronger response after repeated stimuli.", "Habituation is non-associative: a weaker response after repeated stimuli.", null, "Meaningful learning links new ideas to existing knowledge, a cognitive idea."]}, {"w": 2, "q": "The three major types of learning described by ___ psychology are classical conditioning, operant conditioning and observational learning.", "o": ["cognitive", "behavioral", "emotional", "evolutionary"], "a": 1, "why": "Behavioral psychology describes three main types of learning: classical conditioning, operant conditioning and observational learning.", "x": ["Cognitive psychology focuses on mental processes such as memory and thinking.", null, "Emotional psychology is not the school that defined these three types.", "Evolutionary psychology explains behaviour through natural selection."]}, {"w": 2, "q": "According to the view of Watson, psychology is ___.", "o": ["subjective", "only descriptive", "experimental", "about internal mental processes that cannot be measured and observed"], "a": 2, "why": "Watson saw psychology as an objective, experimental science of observable behaviour.", "x": ["Watson rejected subjective methods such as introspection.", "He wanted experiments that predict and control behaviour, not just description.", null, "Watson argued psychology should NOT study unobservable mental processes."]}, {"w": 2, "q": "___ is given by Ivan Pavlov.", "o": ["Operant conditioning", "Functional conditioning", "Classical conditioning", "Modern conditioning"], "a": 2, "why": "Ivan Pavlov discovered classical conditioning through his experiments with salivating dogs.", "x": ["Operant conditioning was developed by B.F. Skinner.", "There is no theory called functional conditioning; Pavlov's work with dogs and bells is classical conditioning.", null, "There is no theory called modern conditioning; Pavlov is known for classical conditioning."]}, {"w": 2, "q": "The process by which organisms learn to respond to certain stimuli but not to others is known as ___.", "o": ["stimulus generalization", "stimulus appreciation", "stimulus discrimination", "stimulus differentiation"], "a": 2, "why": "Stimulus discrimination is learning to respond to one stimulus but not to similar ones.", "x": ["Generalization is the opposite: responding to similar stimuli as well.", "'Stimulus appreciation' is not a learning term.", null, "'Stimulus differentiation' is not the standard term."]}, {"w": 2, "q": "Higher-order conditioning is intrinsically weaker than its first-order counterpart.", "o": ["True", "False"], "a": 0, "why": "True. In higher-order conditioning a new stimulus is paired with an already conditioned stimulus, and the response it produces is usually weaker.", "x": [null, "Research shows second-order responses are typically weaker than first-order ones."]}, {"w": 2, "q": "___ is the process of gradually changing the quality of a response.", "o": ["Shaping", "Modeling", "Cueing", "Shifting"], "a": 0, "why": "Shaping gradually changes a response by reinforcing closer and closer approximations of the target behaviour.", "x": [null, "Modeling is learning by watching others.", "Cueing is giving a signal or prompt.", "'Shifting' is not the term for this process."]}, {"w": 2, "q": "The works of ___ were instrumental in engendering the dramatic shift from behaviorism to cognitive theories.", "o": ["Edward C. Tolman", "Jean Piaget", "German Gestalt", "All of the given"], "a": 3, "why": "Tolman (cognitive maps), Piaget (cognitive development) and the German Gestalt psychologists (insight) together drove the shift to cognitive theories.", "x": ["Tolman contributed, but he was not the only one.", "Piaget contributed, but he was not the only one.", "The Gestalt school contributed, but it was not the only one.", null]}, {"w": 2, "q": "___ intelligence is the ability to perceive the visual–spatial world accurately and involves sensitivity to color, line, shape, form, space, and the potential for recognizing and manipulating the patterns of spaces.", "o": ["Interpersonal", "Spatial", "Bodily-kinesthetic", "Linguistic"], "a": 1, "why": "In Gardner's theory, spatial intelligence is the ability to perceive and mentally manipulate shapes, space and visual patterns.", "x": ["Interpersonal intelligence is understanding other people.", null, "Bodily-kinesthetic intelligence is skill in using the body.", "Linguistic intelligence is skill with words and language."]}, {"w": 2, "q": "Sternberg proposed his theory in 1985 as an alternative to the idea of the ___.", "o": ["general intelligence factor", "multiple intelligences", "specific intelligence factor", "unconscious intelligence"], "a": 0, "why": "Sternberg's triarchic theory (1985) was an alternative to the single 'g', or general intelligence factor.", "x": [null, "Multiple intelligences is Gardner's theory, not what Sternberg was reacting against.", "'Specific intelligence factor' is not the idea he was replacing.", "'Unconscious intelligence' is not a classic theory."]}, {"w": 2, "q": "Which of the following is not a kind of product in the structure of intellect model?", "o": ["symbolic", "classes", "systems", "implications"], "a": 0, "why": "In Guilford's Structure of Intellect model, 'symbolic' is a content type, not a product.", "x": [null, "Classes is one of the six products.", "Systems is one of the six products.", "Implications is one of the six products."]}, {"w": 3, "q": "The connections between nerves cells are called ___.", "o": ["systems", "syntaxes", "neurons", "synapses"], "a": 3, "why": "A synapse is the junction where one nerve cell passes signals to the next.", "x": ["'Systems' is a general term, not the junction between neurons.", "Syntax is about grammar, not the nervous system.", "Neurons are the nerve cells themselves, not the connections between them.", null]}, {"w": 3, "q": "In order to create a ___, information must be changed into a usable form, which occurs through a process known as encoding.", "o": ["past memory", "new imagination", "new memory", "past imagination"], "a": 2, "why": "Encoding changes information into a usable form so that a new memory can be formed.", "x": ["Encoding creates new memories, not past ones.", "Encoding is about memory, not imagination.", null, "Encoding is about memory, not imagination."]}, {"w": 3, "q": "Calling back the stored information in response to some cue for use in a process or activity is called ___.", "o": ["Retrieval", "Recall", "Recollection", "All of the given"], "a": 3, "why": "Retrieval, recall and recollection all describe bringing stored information back in response to a cue.", "x": ["Retrieval fits, but so do the others.", "Recall fits, but so do the others.", "Recollection fits, but so do the others.", null]}, {"w": 3, "q": "For many with ___ deficits, reading facial expressions and knowing how to respond are confusing daily challenges.", "o": ["memory", "intelligence", "social cognition", "biological cognition"], "a": 2, "why": "Social cognition is how we understand other people. A deficit in it makes reading facial expressions hard.", "x": ["Memory deficits affect remembering, not specifically reading faces.", "Intelligence is general ability, not specifically social understanding.", null, "'Biological cognition' is not the standard term."]}, {"w": 3, "q": "The Information Processing View of Learning assumes that there are limits to how much information can be processed at each stage.", "o": ["True", "False"], "a": 0, "why": "True. The information processing view assumes each stage (sensory, working and long-term memory) has a limit on how much it can handle.", "x": [null, "Working memory in particular is limited, about 7 ± 2 items."]}, {"w": 3, "q": "The Information Processing View of Learning assumes that information process is involved in ___", "o": ["forgetting", "remembering", "perceiving", "All of the given"], "a": 3, "why": "The information processing view applies to perceiving, remembering and forgetting.", "x": ["Forgetting is included, but so are the others.", "Remembering is included, but so are the others.", "Perceiving is included, but so are the others.", null]}, {"w": 3, "q": "The capacity of the sensory register is ___.", "o": ["very small", "very large", "7+/-2 chunks", "unlimited"], "a": 1, "why": "The sensory register can hold a very large amount of information, but only for a fraction of a second.", "x": ["Its capacity is large; it is its duration that is very short.", null, "7 ± 2 chunks is the capacity of short-term (working) memory.", "Very large, not literally unlimited, is the accepted description."]}, {"w": 3, "q": "Most children do not begin to engage in the process of rehearsal on their own until about age ___.", "o": ["seven", "two", "thirteen", "one"], "a": 0, "why": "Children usually start using rehearsal, repeating information to remember it, by themselves at around age seven.", "x": [null, "At two, children do not yet use deliberate memory strategies.", "Rehearsal begins well before thirteen.", "At one, children cannot use rehearsal strategies."]}, {"w": 3, "q": "___ provides an interface between the sub-systems of working memory and the part of long term memory specialized for episodic memory.", "o": ["Phonological loop", "Visuo-spatial sketchpad", "Retrieval buffer", "Episodic buffer"], "a": 3, "why": "Baddeley's episodic buffer links the parts of working memory with long-term episodic memory.", "x": ["The phonological loop holds sounds and speech.", "The visuo-spatial sketchpad holds visual and spatial information.", "'Retrieval buffer' is not part of Baddeley's model.", null]}, {"w": 3, "q": "Memories of specific episodes of one’s life refers to ___.", "o": ["declarative memory", "experimental episodic memory", "autobiographical episodic memory", "procedural memory"], "a": 2, "why": "Autobiographical episodic memory stores specific events from your own life.", "x": ["Declarative memory is the broader category of facts and events.", "Memory research has no 'experimental episodic memory' type; memories of your own life are called autobiographical episodic memory.", null, "Procedural memory is for skills such as riding a bike."]}, {"w": 4, "q": "___ thinking is the ability to create mental representations of objects, places, events, or people in your mind.", "o": ["General", "Creative", "Divergent", "Symbolic"], "a": 3, "why": "Symbolic thinking is the ability to represent objects, places, events and people in your mind.", "x": ["'General thinking' is not this specific ability.", "Creative thinking produces new ideas.", "Divergent thinking generates many possible solutions.", null]}, {"w": 4, "q": "We compare new information to our ___ of the person, place, or thing, so we know how to categorize the new information mentally.", "o": ["protofit", "protobite", "prototype", "none of the given"], "a": 2, "why": "A prototype is the most typical example of a category. We compare new things to it to categorize them.", "x": ["'Protofit' is a made-up word; the typical example of a category is called a prototype.", "'Protobite' is a made-up word; the typical example of a category is called a prototype.", null, "Prototype is correct, so 'none' is wrong."]}, {"w": 4, "q": "Which of the following is not true?", "o": ["Thinking is a higher mental process", "Thinking is a sub-vocal talking", "Thinking is fulfilling a need or problem solving", "Thinking is only done in verbal symbols"], "a": 3, "why": "Thinking uses images, concepts and other symbols as well as words, so saying it uses only verbal symbols is not true.", "x": ["This is true: thinking is a higher mental process.", "This is true: thinking has been described as sub-vocal talking.", "This is true: thinking serves problem solving.", null]}, {"w": 4, "q": "Mental images are ___.", "o": ["Auditory", "Visual", "Gustatory", "All of the given"], "a": 3, "why": "Mental images can involve any sense: sound, sight, taste and so on.", "x": ["Auditory images exist, but so do the others.", "Visual images exist, but so do the others.", "Gustatory (taste) images exist, but so do the others.", null]}, {"w": 4, "q": "___ organize complex phenomena into simpler, easily understandable, and usable categories and help to solve our problems.", "o": ["Concepts", "Propositions", "Constructs", "Components"], "a": 0, "why": "Concepts group things into categories, which simplifies complex information and helps with problem solving.", "x": [null, "Propositions are statements that relate concepts.", "Constructs are theoretical ideas, not everyday categories.", "Components are parts of a whole."]}, {"w": 4, "q": "The lowermost level of Bloom’s taxonomy is ___.", "o": ["remember", "apply", "understand", "analyze"], "a": 0, "why": "In the revised Bloom's taxonomy the lowest level is remember (recalling facts).", "x": [null, "Apply is the third level.", "Understand is the second level.", "Analyze is the fourth level."]}, {"w": 4, "q": "The psychomotor domain of the Bloom’s taxonomy is concerned with ___.", "o": ["Biological makeup", "Thoughts and beliefs", "Feelings and emotions", "Skilled behavior"], "a": 3, "why": "The psychomotor domain covers physical, skilled behaviour and movement.", "x": ["Biological makeup is not a Bloom's domain.", "Thoughts and beliefs belong to the cognitive domain.", "Feelings and emotions belong to the affective domain.", null]}, {"w": 4, "q": "Which of the following is an example of meta-cognition skills?", "o": ["Ignoring your limits", "Self-monitoring", "Skimming all important information", "All of the given"], "a": 1, "why": "Metacognition is thinking about your own thinking, and self-monitoring your understanding is a core skill.", "x": ["Ignoring your limits is the opposite of metacognition.", null, "Skimming is a reading technique, not monitoring your own thinking.", "Not all are correct, because ignoring limits is not metacognitive."]}, {"w": 4, "q": "___ critical thinking skill helps you analyze and process information to come to an unbiased conclusion.", "o": ["Open-mindedness", "Self-regulation", "Self-control", "Observation"], "a": 0, "why": "Open-mindedness lets you consider all views fairly, which leads to unbiased conclusions.", "x": [null, "Self-regulation is controlling your own behaviour.", "Self-control is resisting impulses.", "Observation is noticing details, which does not by itself remove bias."]}, {"w": 4, "q": "The inspiration phase of the creative thinking process refers to the ___ stage.", "o": ["Incubation", "Insight", "Evaluation", "Preparation"], "a": 3, "why": "In the creative process, inspiration happens in the first stage, preparation, where you gather information.", "x": ["Incubation is the second stage, when ideas develop unconsciously.", "Insight is the 'aha' moment, which comes later.", "Evaluation is when ideas are judged.", null]}, {"w": 5, "q": "Which of the following is true about motivation?", "o": ["It is a physical impulse", "It is an external process", "It has a willingness to activate but not channel the attitudes of learners", "None of the given"], "a": 3, "why": "Motivation is an internal process that both starts and directs behaviour, so none of the given statements is correct.", "x": ["Motivation is a psychological process, not just a physical impulse.", "Motivation is mainly internal.", "Motivation both activates and channels behaviour, so this is wrong.", null]}, {"w": 5, "q": "The term “motivation” comes from a ___ word.", "o": ["Greek", "Latin", "Hindi", "Bengali"], "a": 1, "why": "'Motivation' comes from the Latin 'movere', meaning to move.", "x": ["It comes from Latin, not Greek.", null, "It is not from Hindi.", "It is not from Bengali."]}, {"w": 5, "q": "It is called extrinsic motivation if causal factor is ___.", "o": ["curiosity", "social pressure", "self-satisfaction", "needs"], "a": 1, "why": "Extrinsic motivation comes from outside the person, such as social pressure, rewards or grades.", "x": ["Curiosity is intrinsic: it comes from within.", null, "Self-satisfaction is intrinsic.", "Inner needs drive intrinsic motivation."]}, {"w": 5, "q": "___ motivation is considered to be more crucial for students as it is associated with deep learning, better performance and self-efficacy.", "o": ["Intrinsic", "Extrinsic", "Introjected regulation", "None of the given"], "a": 0, "why": "Intrinsic motivation, doing something for its own sake, is linked to deep learning, better performance and self-efficacy.", "x": [null, "Extrinsic motivation is more linked to surface learning.", "Introjected regulation is a weaker, partly controlled kind of motivation.", "Intrinsic is correct, so 'none' is wrong."]}, {"w": 5, "q": "___ proposed that there are three primary drives that drive human behavior.", "o": ["Hull", "Watson", "Piaget", "Gestalt"], "a": 0, "why": "Clark Hull's drive-reduction theory names primary drives such as hunger, thirst and sex that push behaviour.", "x": [null, "Watson founded behaviorism but did not propose drive theory.", "Piaget studied cognitive development.", "Gestalt psychology studied perception."]}, {"w": 5, "q": "Expectancy Theory of Motivation was developed by ___.", "o": ["Vroom", "Hull", "Murray", "None of the given"], "a": 0, "why": "Victor Vroom developed Expectancy Theory in 1964.", "x": [null, "Hull developed drive-reduction theory.", "Murray proposed a theory of psychological needs.", "Vroom is correct, so 'none' is wrong."]}, {"w": 5, "q": "An example of ___ is thinking, “If I work hard I can achieve the targets my boss has set for me”.", "o": ["purposeful", "valence", "instrumentality", "expectancy"], "a": 3, "why": "Expectancy is the belief that effort will lead to performance: 'If I work hard I can hit the target.'", "x": ["'Purposeful' is not one of Vroom's three parts.", "Valence is how much you value the reward.", "Instrumentality is the belief that performance will lead to a reward.", null]}, {"w": 5, "q": "In SMART goals, T stands for ___.", "o": ["Temporary", "Time-based", "Tough", "Testing"], "a": 1, "why": "SMART stands for Specific, Measurable, Achievable, Relevant and Time-bound (time-based).", "x": ["Goals should have a deadline, not be temporary.", null, "'Tough' is not part of SMART.", "'Testing' is not part of SMART."]}, {"w": 5, "q": "Friendship is a ___ need in Maslow’s hierarchy.", "o": ["Love and belonging", "Esteem", "Physiological", "Safety"], "a": 0, "why": "In Maslow's hierarchy, friendship meets the love and belonging need.", "x": [null, "Esteem is about respect and recognition.", "Physiological needs are food, water and sleep.", "Safety needs are security and protection."]}, {"w": 5, "q": "___ theory differentiates between autonomous motivation and controlled motivation.", "o": ["Arousal", "Goal-setting", "Need hierarchy", "Self-determination"], "a": 3, "why": "Deci and Ryan's self-determination theory separates autonomous (self-chosen) from controlled motivation.", "x": ["Arousal theory is about the best level of stimulation.", "Goal-setting theory is about specific, challenging goals.", "Need hierarchy is Maslow's theory.", null]}, {"w": 6, "q": "According to Daniel Goleman, ___ component of emotional intelligence focuses on how we handle relationships with others.", "o": ["self-awareness", "motivation", "empathy", "emotional regulation"], "a": 2, "why": "In Goleman's model, empathy is the component about understanding others and handling relationships.", "x": ["Self-awareness is about knowing your own emotions.", "Motivation is about your inner drive to achieve.", null, "Emotional regulation is about managing your own emotions."]}, {"w": 6, "q": "Emotional intelligence can be considered a type of ___ intelligence.", "o": ["academic", "genetic", "social", "external"], "a": 2, "why": "Emotional intelligence is seen as a type of social intelligence, the ability to understand and manage people and relationships.", "x": ["EI is different from academic (IQ-type) intelligence.", "EI is not purely genetic; it can be developed.", null, "Psychology has no 'external intelligence'; EI is grouped with social intelligence because it deals with emotions and relationships."]}, {"w": 6, "q": "Noticing a difficult emotion and slowing down or resisting any impulsive action that may follow highlights ___ component of emotional intelligence.", "o": ["Self-regulation", "Motivation", "Emotional literacy", "Empathy"], "a": 0, "why": "Self-regulation means noticing a strong emotion and pausing instead of acting on impulse.", "x": [null, "Motivation is your drive towards goals.", "Emotional literacy is naming and understanding emotions.", "Empathy is understanding other people's feelings."]}, {"w": 6, "q": "The following are signs of emotional intelligence, except ___.", "o": ["strong sense of curiosity", "holding onto mistakes", "ability to manage emotions in difficult situations", "self-confidence"], "a": 1, "why": "Holding onto mistakes shows poor emotional regulation, so it is NOT a sign of high emotional intelligence.", "x": ["Curiosity IS a sign of emotional intelligence.", null, "Managing emotions in difficult situations IS a sign of emotional intelligence.", "Self-confidence IS a sign of emotional intelligence."]}, {"w": 6, "q": "Perceiving emotions means ___.", "o": ["Ignoring signals", "Understanding only what somebody is saying to you", "Understanding only somebody’s facial expression", "Understanding both verbal and nonverbal signals"], "a": 3, "why": "Perceiving emotions means reading both what people say (verbal) and their body language and expressions (nonverbal).", "x": ["Ignoring signals is the opposite of perceiving emotions.", "Words alone miss the nonverbal cues.", "Facial expressions alone miss what is said.", null]}, {"w": 6, "q": "___ suggests that 10 distinct components provide the scaffolding of emotionally and socially intelligent behaviors:", "o": ["Bar-On", "Goleman", "Salovey", "Mayer"], "a": 0, "why": "Reuven Bar-On's model describes the components of emotionally and socially intelligent behaviour.", "x": [null, "Goleman's model has five components.", "Salovey, with Mayer, proposed the four-branch ability model.", "Mayer, with Salovey, proposed the four-branch ability model."]}, {"w": 6, "q": "Which of the following is a facilitator of EQ?", "o": ["optimism", "happiness", "independence", "all of the given"], "a": 3, "why": "Optimism, happiness and independence are all described as facilitators of EQ.", "x": ["Optimism is a facilitator, but so are the others.", "Happiness is a facilitator, but so are the others.", "Independence is a facilitator, but so are the others.", null]}, {"w": 6, "q": "___ is a strategy for improving one’s self-awareness.", "o": ["rejecting feedback", "using critical self-talk daily", "developing a fixed mindset", "pursuing one’s passion"], "a": 3, "why": "Pursuing your passions helps you discover what you value and how you feel, which builds self-awareness.", "x": ["Rejecting feedback blocks self-awareness.", "Harsh self-talk hurts emotional health.", "A fixed mindset stops growth.", null]}, {"w": 6, "q": "Having students create autobiographies is an example of creating opportunities for ___.", "o": ["emotional labor", "emotional contagion", "metacognition", "none of the given"], "a": 2, "why": "Writing an autobiography makes students reflect on their own thinking and experiences, which is metacognition.", "x": ["Emotional labor is managing emotions as part of a job.", "Emotional contagion is catching other people's emotions.", null, "Metacognition is correct, so 'none' is wrong."]}, {"w": 6, "q": "Which of the following is not true about management of emotions?", "o": ["It is essentially a private act", "It is directly regulated by others", "It is influenced by cultural norms", "It is influenced by what society defines as appropriate to feel and express"], "a": 1, "why": "Managing emotions is mainly a personal act shaped by culture. It is not directly controlled by other people.", "x": ["This is true: emotion management is essentially private.", null, "This is true: it is influenced by cultural norms.", "This is true: society shapes which feelings are appropriate."]}, {"w": 7, "q": "Which of the following is false about learning according to Gagne’s definition?", "o": ["It is a change in human disposition", "It persists over a period of time", "It is simply ascribable to processes of growth", "None of the above"], "a": 2, "why": "Gagne said learning is a lasting change in disposition that is NOT simply due to growth, so this statement is the false one.", "x": ["This is true: learning is a change in human disposition.", "This is true: learning persists over time.", null, "Option C is false, so 'none' is wrong."]}, {"w": 7, "q": "Manual or physical skills come under ___ component of Bloom’s taxonomy.", "o": ["Cognitive", "Affective", "Psychomotor", "Physical"], "a": 2, "why": "Manual and physical skills belong to the psychomotor domain of Bloom's taxonomy.", "x": ["The cognitive domain covers knowledge and thinking.", "The affective domain covers feelings and attitudes.", null, "'Physical' is not one of Bloom's domain names."]}, {"w": 7, "q": "Reflection, learning and education was explored by ___.", "o": ["Carl Rogers", "John Watson", "Benjamin Bloom", "John Dewey"], "a": 3, "why": "John Dewey wrote about reflection, experience and education, for example in 'How We Think'.", "x": ["Carl Rogers focused on person-centred learning.", "John Watson founded behaviorism.", "Benjamin Bloom created the taxonomy of learning objectives.", null]}, {"w": 7, "q": "The principles of ___ refer to how close in time two events must be for a bond to be formed.", "o": ["behavior", "reinforcement", "repetition", "contiguity"], "a": 3, "why": "Contiguity means two events must happen close together in time to become linked.", "x": ["'Behavior' is too general a term.", "Reinforcement is about consequences that strengthen behaviour.", "Repetition is about practice.", null]}, {"w": 7, "q": "___ gives information to learners about their success or failure concerning the task at hand.", "o": ["Cognitive feedback", "Emotional feedback", "Reinforcement", "Physical feedback"], "a": 0, "why": "Cognitive feedback tells learners whether they succeeded or failed at the task.", "x": [null, "Emotional feedback is about feelings, not task performance.", "Reinforcement strengthens behaviour; it is not mainly information.", "Physical feedback (touch or movement cues) is not what tells learners about task success; that is cognitive feedback."]}, {"w": 7, "q": "The ___ orientation to learning has a quality of personal involvement—the whole person in both feeling and cognitive aspects being in the learning event.", "o": ["behavioral", "cognitive", "humanistic", "social"], "a": 2, "why": "The humanistic orientation involves the whole person, both feelings and thinking, in learning.", "x": ["The behavioral orientation focuses on observable behaviour only.", "The cognitive orientation focuses on mental processes, not feelings.", null, "The social orientation focuses on learning from others."]}, {"w": 7, "q": "Learning through play is ___ learning.", "o": ["primary", "secondary", "passive", "active"], "a": 3, "why": "Learning through play is active learning, because the learner is doing and exploring.", "x": ["'Primary' describes a level of schooling, not a kind of learning; play is called active learning because the child is doing and exploring.", "'Secondary' describes a level of schooling, not a kind of learning; play is active learning.", "In play the learner is involved, not passive.", null]}, {"w": 7, "q": "People with ___ learning style are prone to sorting their ideas after speaking, rather than thinking ideas through before.", "o": ["logical", "solitary", "visual", "auditory"], "a": 3, "why": "Auditory learners often sort out their ideas by talking them through.", "x": ["Logical learners prefer reasoning and systems.", "Solitary learners prefer working alone.", "Visual learners prefer pictures and diagrams.", null]}, {"w": 7, "q": "Which of the following statements is false?", "o": ["Effective instruction is static", "Effective instruction is eclectic", "Effective instruction is generative", "Effective instruction is interactive"], "a": 0, "why": "Effective instruction changes and adapts, so 'static' is the false statement.", "x": [null, "This is true: effective instruction is eclectic (uses varied methods).", "This is true: effective instruction is generative.", "This is true: effective instruction is interactive."]}, {"w": 7, "q": "In ADDIE model, I stand for ___.", "o": ["instruction", "implementation", "integration", "induction"], "a": 1, "why": "ADDIE stands for Analysis, Design, Development, Implementation, Evaluation.", "x": ["I is not instruction.", null, "I is not integration.", "I is not induction."]}, {"w": 8, "q": "The word ‘pedagogy’ has been derived from the ___ word “pedagogue”.", "o": ["Latin", "Sanskrit", "Greek", "English"], "a": 2, "why": "'Pedagogy' comes from the Greek 'paidagogos', meaning the one who leads children.", "x": ["It is Greek, not Latin.", "It is not from Sanskrit.", null, "English borrowed the word from Greek."]}, {"w": 8, "q": "Which of the following statements is not true about pedagogy?", "o": ["It is a method or way of teaching", "It is derived from the Greek word “pedagogue”", "It helps a teacher understand how learning should be facilitated.", "It harms the quality of teaching and learning."], "a": 3, "why": "Pedagogy improves teaching and learning, so saying it harms them is not true.", "x": ["This is true: pedagogy is a method of teaching.", "This is true: the word comes from Greek.", "This is true: pedagogy helps teachers facilitate learning.", null]}, {"w": 8, "q": "Pedagogy can enhance the student-teacher relationship.", "o": ["True", "False"], "a": 0, "why": "True. Good pedagogy builds understanding and trust between students and teachers.", "x": [null, "Good pedagogy does strengthen the relationship."]}, {"w": 8, "q": "___ learning is based on the model that knowledge can be created within a population where members actively interact by sharing experiences and take on asymmetry roles.", "o": ["integrative", "inquiry-based", "collaborative", "constructivist"], "a": 2, "why": "Collaborative learning creates knowledge through members interacting, sharing experiences and taking on different roles.", "x": ["Integrative learning connects ideas across subjects.", "Inquiry-based learning is driven by questions.", null, "Constructivist learning focuses on individuals building their own understanding."]}, {"w": 8, "q": "The Pedagogical Model provides an overview of the learning cycle and breaks it down into ___ domains or phases of instruction.", "o": ["five", "three", "two", "seven"], "a": 0, "why": "The Pedagogical Model breaks the learning cycle into five phases of instruction.", "x": [null, "It has five phases, not three.", "It has five phases, not two.", "It has five phases, not seven."]}, {"w": 8, "q": "Which of the following is not a type of inquiry-based approach?", "o": ["confrontation", "structure", "guided", "open"], "a": 0, "why": "Confrontation is not a type of inquiry-based learning. The types include structured, guided and open inquiry.", "x": [null, "Structured inquiry IS a type.", "Guided inquiry IS a type.", "Open inquiry IS a type."]}, {"w": 8, "q": "In experiential learning, students are engaged ___.", "o": ["intellectually", "soulfully", "socially", "all of the given"], "a": 3, "why": "Experiential learning engages students intellectually, emotionally (soulfully) and socially.", "x": ["Intellectual engagement is included, but so are the others.", "Emotional engagement is included, but so are the others.", "Social engagement is included, but so are the others.", null]}, {"w": 8, "q": "___ stage of experiential theory by Kolb focuses on planning.", "o": ["concrete experience", "abstract conceptualization", "reflective observation", "active experimentation"], "a": 3, "why": "In Kolb's cycle, active experimentation is when you plan and try out what you have learned.", "x": ["Concrete experience is doing or having an experience.", "Abstract conceptualization is forming ideas and theories.", "Reflective observation is reviewing the experience.", null]}, {"w": 8, "q": "People with a ___ learning style can often act on “gut feeling” and will rely on others' analysis rather than their own.", "o": ["accommodating", "converging", "diverging", "assimilating"], "a": 0, "why": "In Kolb's styles, accommodating learners are hands-on, act on gut feeling and rely on others' analysis.", "x": [null, "Converging learners prefer practical problem solving with their own analysis.", "Diverging learners prefer watching and generating ideas.", "Assimilating learners prefer logical, abstract ideas."]}, {"w": 8, "q": "According to the ___ principle, students learn better from animation and narration than from animation and on-screen text.", "o": ["multimedia", "modality", "coherence", "temporal contiguity"], "a": 1, "why": "Mayer's modality principle says people learn better from animation plus narration than from animation plus on-screen text.", "x": ["The multimedia principle says words plus pictures beat words alone.", null, "The coherence principle says to remove extra material.", "Temporal contiguity says to present words and pictures at the same time."]}, {"w": 9, "q": "E-learning is any form of ___.", "o": ["teaching", "training", "tutoring", "all of the given"], "a": 3, "why": "E-learning covers teaching, training and tutoring delivered electronically.", "x": ["Teaching is included, but so are the others.", "Training is included, but so are the others.", "Tutoring is included, but so are the others.", null]}, {"w": 9, "q": "___ is a feature of e-learning.", "o": ["difficulty in access", "user friendliness", "social injustice", "closed learning"], "a": 1, "why": "E-learning is designed to be user-friendly and easy to access.", "x": ["E-learning makes access easier, not harder.", null, "E-learning aims to reduce inequality, not create it.", "E-learning is open and flexible, not closed."]}, {"w": 9, "q": "E-learning is a synonym of audio-visual learning, multimedia learning, and distance learning.", "o": ["True", "False"], "a": 1, "why": "False. Audio-visual, multimedia and distance learning are related to e-learning, but they are not the same thing.", "x": ["These are related ideas, not exact synonyms.", null]}, {"w": 9, "q": "Which of the following is not a type of e-learning?", "o": ["text-driven", "interactive", "simulation", "physical"], "a": 3, "why": "E-learning is delivered digitally, so 'physical' is not a type of e-learning.", "x": ["Text-driven e-learning IS a type.", "Interactive e-learning IS a type.", "Simulation e-learning IS a type.", null]}, {"w": 9, "q": "Which of the following is not a benefit of e-learning?", "o": ["It can accommodate the need of a housewife", "People can revise the learning content as many times as they want", "It facilitates in developing and communicating new training policies", "None of the given"], "a": 3, "why": "All three statements are real benefits of e-learning, so none of them is 'not a benefit'.", "x": ["Fitting around a homemaker's schedule IS a benefit.", "Revising content any number of times IS a benefit.", "Helping develop and communicate new training policies IS a benefit.", null]}, {"w": 9, "q": "Good learners know ___.", "o": ["What they are learning", "Why they are learning", "How they are learning", "All of the given"], "a": 3, "why": "Good learners know what, why and how they are learning.", "x": ["What is included, but so are why and how.", "Why is included, but so are what and how.", "How is included, but so are what and why.", null]}, {"w": 9, "q": "Learners may multitask when engaging in an online course, which could be resulting in ___.", "o": ["hyperfocus", "better retrieval", "shorter attention spans", "None of the given"], "a": 2, "why": "Multitasking during online courses splits attention, leading to shorter attention spans.", "x": ["Multitasking reduces focus; it does not cause hyperfocus.", "Divided attention makes retrieval worse.", null, "Shorter attention spans is correct, so 'none' is wrong."]}, {"w": 9, "q": "___ learning is the crucial determinant of successful e-learning.", "o": ["passive", "retrospective", "social", "active"], "a": 3, "why": "Active learning, where learners engage and do things, is the key to successful e-learning.", "x": ["Passive watching leads to weak learning.", "'Retrospective learning' is not the key factor.", "Social learning helps, but active learning is named as crucial.", null]}, {"w": 9, "q": "The brain can process 36,000 visual cues per___.", "o": ["hour", "second", "day", "year"], "a": 0, "why": "The popular figure used in e-learning design is that the brain can process 36,000 visual messages per hour.", "x": [null, "The usual figure is per hour, not per second.", "The usual figure is per hour, not per day.", "The usual figure is per hour, not per year."]}, {"w": 9, "q": "For effective learning, online courses should ___.", "o": ["use headings", "use complex language", "present long pieces of text", "use random images"], "a": 0, "why": "Clear headings help learners scan and organise online content.", "x": [null, "Simple language works better online.", "Long blocks of text are hard to read on screen.", "Images should be relevant, not random."]}, {"w": 10, "q": "During Covid-19 the world was busy in preparing 1.5 billion learners for the new normal, i.e., ___ learning.", "o": ["ineffective", "physical", "remote", "experiential"], "a": 2, "why": "During Covid-19, about 1.5 billion learners moved to remote learning.", "x": ["The aim was effective remote learning, not ineffective.", "Schools were closed, so learning was not physical.", null, "Experiential learning was not the main shift."]}, {"w": 10, "q": "To develop learner readiness for online learning, training sessions on ___ are helpful.", "o": ["netiquettes", "time management", "developing study skills", "all of the given"], "a": 3, "why": "Training on netiquette, time management and study skills all help learners get ready for online learning.", "x": ["Netiquette helps, but so do the others.", "Time management helps, but so do the others.", "Study skills help, but so do the others.", null]}, {"w": 10, "q": "The typical picture of a teacher being a dispenser of knowledge to the students has been replaced by that of a ___.", "o": ["obstructor", "parent", "friend", "facilitator"], "a": 3, "why": "The teacher's role has changed from giving out knowledge to facilitating learning.", "x": ["A teacher should help learning, not obstruct it.", "'Parent' is not the role described.", "Teachers can be friendly, but the role described is facilitator.", null]}, {"w": 10, "q": "In 2018, Global Education and Skills Forum noted that the ‘future’ teacher would need the 5 skills to thrive in the 21st century. Which of the following is not one of them?", "o": ["Strong social skills", "Data analysis", "External focus", "Strictness"], "a": 3, "why": "Strictness is not one of the five future-teacher skills; social skills, data analysis and an external focus are.", "x": ["Strong social skills IS one of them.", "Data analysis IS one of them.", "External focus IS one of them.", null]}, {"w": 10, "q": "Participatory education demands ___ so as to build a needs-based approach to teaching.", "o": ["creativity", "stubbornness", "reward", "none of the given"], "a": 0, "why": "Participatory education needs creativity to build teaching around learners' real needs.", "x": [null, "Stubbornness blocks a needs-based approach.", "Rewards alone do not build a needs-based approach.", "Creativity is correct, so 'none' is wrong."]}, {"w": 10, "q": "Students who consider intelligence as a malleable entity tend to focus on their obstacles instead of goals.", "o": ["True", "False"], "a": 1, "why": "False. Students with a growth mindset (intelligence can grow) focus on goals and effort, not obstacles.", "x": ["A growth mindset leads to focusing on goals, not obstacles.", null]}, {"w": 10, "q": "Which of the following is not a principle to enhance student learning.", "o": ["What students already know affects their learning", "Learning is context-based", "Students’ cognitive development and learning is limited by the general stages of development.", "The acquisition of knowledge and skills in the long term depends largely on practice."], "a": 2, "why": "Learning is not strictly limited by fixed general stages; context and support matter. So this is not a principle for enhancing learning.", "x": ["This IS a principle: prior knowledge affects learning.", "This IS a principle: learning depends on context.", null, "This IS a principle: long-term learning depends on practice."]}, {"w": 10, "q": "___ feedback to students is important for learning.", "o": ["Unclear", "Late", "Harsh", "Explanatory"], "a": 3, "why": "Explanatory feedback tells students why an answer is right or wrong, which helps them learn.", "x": ["Unclear feedback confuses students.", "Late feedback is less useful.", "Harsh feedback demotivates.", null]}, {"w": 10, "q": "Mastery goals are those that are geared towards the acquisition or improvement of___.", "o": ["Skills", "Number of students in a classroom", "Teacher feedback", "None of the given"], "a": 0, "why": "Mastery goals focus on gaining or improving skills, not on beating others.", "x": [null, "Class size is not a learning goal.", "Teacher feedback is a tool, not the goal itself.", "Skills is correct, so 'none' is wrong."]}, {"w": 10, "q": "The vast majority of formative assessment is___.", "o": ["Formal", "Incorrect", "Written", "informal"], "a": 3, "why": "Most formative assessment is informal, such as questions, observation and quick checks during learning.", "x": ["Formal assessment is more typical of summative tests.", "'Incorrect' describes an answer, not a kind of assessment. Formative assessment is classified as formal or informal, and most of it is informal.", "Much formative assessment is spoken or observed, not written.", null]}, {"w": 11, "q": "Social cognition has a protracted development through infancy to ___.", "o": ["teenage", "old-age", "adulthood", "death"], "a": 2, "why": "Social cognition keeps developing from infancy all the way into adulthood.", "x": ["Development continues past the teenage years.", "The development described ends in adulthood, not old age.", null, "'Death' is not the end point of development described."]}, {"w": 11, "q": "Which of the following abilities comes under social cognition?", "o": ["Face processing", "Joint attention", "Theory of mind", "All of the given"], "a": 3, "why": "Face processing, joint attention and theory of mind are all social-cognitive abilities.", "x": ["Face processing is included, but so are the others.", "Joint attention is included, but so are the others.", "Theory of mind is included, but so are the others.", null]}, {"w": 11, "q": "Under social cognition, abilities involved in affective processing are often called ___.", "o": ["hot", "cold", "white", "black"], "a": 0, "why": "Emotion-related (affective) social cognition is called 'hot' cognition.", "x": [null, "'Cold' cognition is non-emotional reasoning.", "Social cognition is split into 'hot' (emotional) and 'cold' (non-emotional) processing; there is no 'white' category.", "Social cognition is split into 'hot' (emotional) and 'cold' (non-emotional) processing; there is no 'black' category."]}, {"w": 11, "q": "Social schemas refer to people's mental representations of social ___.", "o": ["values", "memories", "skills", "patterns"], "a": 3, "why": "Social schemas are mental frameworks for social patterns: how people and situations usually behave.", "x": ["Values are beliefs, not schemas.", "Memories are stored experiences.", "Skills are abilities.", null]}, {"w": 11, "q": "During the earliest stages of development, children are very ___-centric. They see the world from their own perspective and struggle to think about how other people may view the world.", "o": ["selfish", "ego", "conscious", "emotional"], "a": 1, "why": "Young children are egocentric: they see the world only from their own point of view (Piaget).", "x": ["'Selfish' is about behaviour, not the inability to take another view.", null, "Young children are not described as conscious-centric; Piaget's term for seeing only your own point of view is egocentric.", "Young children are not described as emotional-centric; Piaget's term for seeing only your own point of view is egocentric."]}, {"w": 11, "q": "A theory of mind refers to a person's ability to understand and think about the ___ of other people.", "o": ["behaviors", "family backgrounds", "mental states", "language"], "a": 2, "why": "Theory of mind is understanding that others have their own mental states: beliefs, desires and intentions.", "x": ["Behaviour is observable; theory of mind is about mental states.", "Family background is not what theory of mind covers.", null, "Language is a tool, not the mental states themselves."]}, {"w": 11, "q": "The same social behavior in one cultural setting might have a very different meaning and interpretation if it were to occur or be observed in another culture.", "o": ["True", "False"], "a": 0, "why": "True. The meaning of a behaviour depends on culture; a gesture can mean different things in different cultures.", "x": [null, "Culture clearly changes how behaviour is interpreted."]}, {"w": 11, "q": "Social cognitive theory by Bandura focuses on concepts of ___.", "o": ["self-efficacy", "modeling", "observational learning", "all of the given"], "a": 3, "why": "Bandura's social cognitive theory covers self-efficacy, modeling and observational learning.", "x": ["Self-efficacy is included, but so are the others.", "Modeling is included, but so are the others.", "Observational learning is included, but so are the others.", null]}, {"w": 11, "q": "The central tenet of Bandura’s social-cognitive theory is that people seek to develop a sense of ___ over the important events in their lives.", "o": ["agency", "dependency", "attachment", "emotion"], "a": 0, "why": "Bandura's central idea is human agency: people want control over the important events in their lives.", "x": [null, "Bandura stresses self-direction, not dependency.", "Attachment is Bowlby's theory.", "Emotion is not the central tenet."]}, {"w": 11, "q": "___ hypothesis suggests that social processes influence how information is selected, organized, integrated, and retrieved.", "o": ["activation", "cognitive influence", "interaction", "social cue strength"], "a": 1, "why": "The cognitive influence hypothesis says social processes shape how information is selected, organised, integrated and retrieved.", "x": ["Activation is about priming concepts.", null, "'Interaction' is too general.", "Social cue strength is a different idea."]}, {"w": 12, "q": "Sustainability in economic sustainability is ___.", "o": ["multidimensional", "bidimensional", "unidimensional", "none of the given"], "a": 2, "why": "The course answer key marks 'unidimensional' for sustainability in economic sustainability. Note that sustainability as a whole is often described as multidimensional.", "x": ["Not the answer in the course key.", "Not the answer in the course key.", null, "The key gives an answer, so 'none' is wrong."]}, {"w": 12, "q": "The term \"sustainable development\" was first mentioned in a book related to the 1972 UN Stockholm conference on ___.", "o": ["water", "poverty", "economic crisis", "human environment"], "a": 3, "why": "The 1972 UN Stockholm Conference was the Conference on the Human Environment.", "x": ["The conference was not on water.", "The conference was not on poverty.", "The conference was not on economic crisis.", null]}, {"w": 12, "q": "Environmental sustainability focuses on impacts of processes, products and services on ___.", "o": ["water", "biodiversity", "human health", "all of the given"], "a": 3, "why": "Environmental sustainability looks at impacts on water, biodiversity and human health.", "x": ["Water is included, but so are the others.", "Biodiversity is included, but so are the others.", "Human health is included, but so are the others.", null]}, {"w": 12, "q": "Which of the following does not come under social sustainability?", "o": ["Labour practices", "Revenue generation", "Human rights", "Business ethics"], "a": 1, "why": "Revenue generation belongs to economic sustainability, not social sustainability.", "x": ["Labour practices ARE part of social sustainability.", null, "Human rights ARE part of social sustainability.", "Business ethics ARE part of social sustainability."]}, {"w": 12, "q": "SDG ___ focuses on clean water and sanitation.", "o": ["1", "17", "6", "3"], "a": 2, "why": "SDG 6 is Clean Water and Sanitation.", "x": ["SDG 1 is No Poverty.", "SDG 17 is Partnerships for the Goals.", null, "SDG 3 is Good Health and Well-being."]}, {"w": 12, "q": "SDG 16 focuses on ___.", "o": ["No poverty", "No hunger", "Good health", "Peace and justice"], "a": 3, "why": "SDG 16 is Peace, Justice and Strong Institutions.", "x": ["No Poverty is SDG 1.", "Zero Hunger is SDG 2.", "Good Health is SDG 3.", null]}, {"w": 12, "q": "On 20 October 2020, the Higher Education Sustainability Initiative (HESI) raised the flag of higher education as a driver for sustainable development and inclusive societies on the first day of the ___ 2020.", "o": ["National Sustainability Meeting", "National Teachers Meeting", "Global Childrens’ Meeting", "Global Education Meeting"], "a": 3, "why": "HESI raised this flag on the first day of the Global Education Meeting 2020 (20 October 2020).", "x": ["The event was global, not national.", "The event was not a teachers' meeting.", "The event was not a children's meeting.", null]}, {"w": 12, "q": "Education is related to all SDGs.", "o": ["True", "False"], "a": 0, "why": "True. Education supports every SDG, which is why SDG 4 (Quality Education) is seen as a driver of all the goals.", "x": [null, "Education is linked to all SDGs."]}, {"w": 12, "q": "Successful implementation of ESD requires a shift in focus from ___.", "o": ["teaching to learning", "learning to teaching", "reading to speaking", "knowing to ignoring"], "a": 0, "why": "Education for Sustainable Development (ESD) shifts the focus from teaching to learning, so the learner is at the centre.", "x": [null, "This is the reverse di
